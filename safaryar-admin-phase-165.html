/* ==================== PHASE 136 — Feedback Management (Global) ====================
   Source of Truth فیدبک‌ها STATE.feedbacks در MAIN_STORAGE_KEY است و ادمین آن را هرگز
   نمی‌نویسد (persistState اپ اصلی آن را overwrite می‌کرد). «مدیریت» یعنی لایه‌ی ادمین
   روی فیدبک: وضعیت بررسی + یادداشت داخلی + آرشیو؛ این‌ها در کلید مستقل
   FEEDBACK_ADMIN_KEY و با feedbackId نگه‌داری می‌شوند و هرگز به کاربر نمایش داده نمی‌شوند.
   برچسب گزینه‌ها از Export فقط‌خواندنی main (FEEDBACK_OPTIONS_EXPORT_KEY) می‌آید — نه کپی. */
const FEEDBACK_OPTIONS_EXPORT_KEY = 'sefaryar_feedback_options_v1';
const FEEDBACK_ADMIN_KEY = 'sefaryar_feedback_admin_v1';
const ADMIN_FEEDBACK_STATUS_META = {
  new:      {label:'جدید',       badge:'inactive'},
  reviewed: {label:'بررسی‌شده',  badge:'active'},
  archived: {label:'آرشیو',      badge:'inactive'},
};
function adminFeedbackStatusMeta(s){ return ADMIN_FEEDBACK_STATUS_META[s] || ADMIN_FEEDBACK_STATUS_META.new; }
/* تبدیل میلادی→شمسی: عیناً همان الگوریتم مرجع Jalaali که main.html (gToJalali) استفاده می‌کند —
   با پیشوند adm_ تا با هیچ نام سراسری ادمین تداخل نکند. (نسخه‌ی اول با فرمول فشرده در ~۱۱٪ روزها
   یک روز اختلاف داشت؛ در تست تطبیقی با main کشف و با این الگوریتم اثبات‌شده جایگزین شد.) */
function adm_div(a,b){ return ~~(a/b); }
function adm_mod(a,b){ return a - ~~(a/b)*b; }
function adm_jalCal(jy){
  const breaks = [-61,9,38,199,426,686,756,818,1111,1181,1210,1635,2060,2097,2192,2262,2324,2394,2456,3178];
  const bl = breaks.length, gy = jy+621;
  let leapJ=-14, jp=breaks[0], jump=0;
  if(jy < jp || jy >= breaks[bl-1]) throw new Error('invalid jalali year');
  for(let i=1;i<bl;i+=1){ const jm=breaks[i]; jump=jm-jp; if(jy<jm) break; leapJ += adm_div(jump,33)*8 + adm_div(adm_mod(jump,33),4); jp=jm; }
  let n = jy-jp;
  leapJ += adm_div(n,33)*8 + adm_div(adm_mod(n,33)+3,4);
  if(adm_mod(jump,33)===4 && (jump-n)===4) leapJ += 1;
  const leapG = adm_div(gy,4) - adm_div((adm_div(gy,100)+1)*3,4) - 150;
  const march = 20 + leapJ - leapG;
  if(jump-n<6) n = n - jump + adm_div(jump+4,33)*33;
  let leap = adm_mod(adm_mod(n+1,33)-1,4);
  if(leap===-1) leap=4;
  return {leap, gy, march};
}
function adm_g2d(gy,gm,gd){
  let d = adm_div((gy+adm_div(gm-8,6)+100100)*1461,4) + adm_div(153*adm_mod(gm+9,12)+2,5) + gd - 34840408;
  d = d - adm_div(adm_div(gy+100100+adm_div(gm-8,6),100)*3,4) + 752;
  return d;
}
function adm_j2d(jy,jm,jd){
  const r = adm_jalCal(jy);
  return adm_g2d(r.gy,3,r.march) + (jm-1)*31 - adm_div(jm,7)*(jm-7) + jd - 1;
}
function adm_d2g(jdn){
  let j=4*jdn+139361631; j=j+adm_div(adm_div(4*jdn+183187720,146097)*3,4)*4-3908;
  const i = adm_div(adm_mod(j,1461),4)*5+308;
  const gd = adm_div(adm_mod(i,153),5)+1;
  const gm = adm_mod(adm_div(i,153),12)+1;
  const gy = adm_div(j,1461)-100100+adm_div(8-gm,6);
  return {gy,gm,gd};
}
function adm_d2j(jdn){
  const gy = adm_d2g(jdn).gy;
  let jy = gy-621;
  let r = adm_jalCal(jy);
  const jdn1f = adm_g2d(gy,3,r.march);
  let k = jdn-jdn1f;
  if(k>=0){
    if(k<=185) return {jy, jm:1+adm_div(k,31), jd:adm_mod(k,31)+1};
    k -= 186;
  } else {
    jy -= 1; k += 179;
    r = adm_jalCal(jy);
    if(r.leap===1) k += 1;
  }
  return {jy, jm:7+adm_div(k,30), jd:adm_mod(k,30)+1};
}
function adminToJalali(iso){
  const m = /^(\d{4})-(\d{2})-(\d{2})/.exec(String(iso||''));
  if(!m) return null;
  try{ return adm_d2j(adm_g2d(+m[1], +m[2], +m[3])); }catch(e){ return null; }
}
const ADMIN_JALALI_MONTHS = ['فروردین','اردیبهشت','خرداد','تیر','مرداد','شهریور','مهر','آبان','آذر','دی','بهمن','اسفند'];
function adminFmtJalali(iso){
  const j = adminToJalali(iso);
  if(!j) return '—';
  return `${j.jd.toLocaleString('fa-IR')} ${ADMIN_JALALI_MONTHS[j.jm-1]} ${String(j.jy).replace(/\d/g,d=>'۰۱۲۳۴۵۶۷۸۹'[d])}`;
}

/* Join: فیدبک‌های main + گزینه‌ها + هویت کاربر/سفر + لایه‌ی ادمین. فقط‌خواندنی نسبت به main. */
function loadAllFeedbacksGlobal(){
  const snap = readMainSnapshot();
  const list = Array.isArray(snap.feedbacks) ? snap.feedbacks : [];
  const trips = Array.isArray(snap.trips) ? snap.trips : [];
  const known = (snap.knownUsers && typeof snap.knownUsers==='object') ? snap.knownUsers : {};
  const usersById = {};
  Object.keys(known).forEach(ph=>{ const u = known[ph]; if(u && u.id) usersById[u.id] = Object.assign({phone:ph}, u); });
  const opts = loadFeedbackOptionsMap();
  const meta = loadFeedbackAdminMeta();
  return list.filter(f=>f && f.id).map(f=>{
    const trip = trips.find(t=>t.id===f.tripId);
    const u = usersById[f.userId];
    const liveName = u ? ((u.firstName||'')+' '+(u.lastName||'')).trim() : '';
    const keys = Array.isArray(f.selectedOptionKeys) ? f.selectedOptionKeys : [];
    const choices = keys.map(k=>{
      const o = opts[k];
      // گزینه‌ای که دیگر در Export نیست (حذف/تغییر نام در main) خام نمایش داده می‌شود، نه اینکه گم شود
      return o ? {key:k, label:o.label, sentiment:o.sentiment} : {key:k, label:k, sentiment: k.indexOf('issue_')===0?'negative':'positive'};
    });
    const m = meta[f.id] || {};
    return {
      id: f.id, tripId: f.tripId, userId: f.userId,
      userName: liveName || f.userName || '—',
      userPhone: (u && u.phone) || f.userPhone || '',
      tripTitle: (trip ? ((trip.origin||'')+' ← '+(trip.destinationName||'')).trim() : '') || f.tripTitle || '—',
      createdAt: f.createdAt || '', updatedAt: f.updatedAt || '',
      comment: (typeof f.comment==='string' && f.comment.trim()) ? f.comment.trim() : '', // PHASE 137 (پیوست) — نظر آزاد کاربر
      choices,
      negativeCount: choices.filter(c=>c.sentiment==='negative').length,
      status: ADMIN_FEEDBACK_STATUS_META[m.status] ? m.status : 'new',
      note: m.note || '',
    };
  }).sort((a,b)=> String(b.updatedAt||b.createdAt).localeCompare(String(a.updatedAt||a.createdAt)));
}

/* ==================== PHASE 138 — Support Inbox (صندوق پشتیبانی) ====================
   یک صندوق مشترک؛ به هیچ ادمین خاصی وابسته نیست. برای هر کاربر یک کارت.
   Source of Truth: کلید مشترک SUPPORT_CHAT_KEY (main هم می‌نویسد). ادمین نیز روی آن می‌نویسد،
   ولی همیشه «بخوان ← فقط همان thread را تغییر بده ← بنویس» تا نوشتن هم‌زمان کاربر (تب دیگر) پاک نشود.
   قواعد کارت (طبق تصمیم محصول):
   - کارت بسته: فقط «آخرین پیام کاربر» + مشخصات کاربر + دکمه‌ی «پاسخ».
   - کارت باز (بعد از زدن «پاسخ»): گفت‌وگوی کامل + کادر پاسخ.
   - ادمین می‌تواند پیام کاربر را حذف کند (کاربر «توسط پشتیبانی حذف شد» می‌بیند) و پاسخ‌های خودش را
     ویرایش/حذف کند. */
const SUPPORT_CHAT_KEY = 'sefaryar_support_chat_v1';
const BUG_REPORTS_KEY = 'sefaryar_bug_reports_v1'; // PHASE 164 — dedicated user-submitted error reports
const SUPPORT_MSG_MAX = 1000;
/* PHASE 138 — فیلدهای تیکت (Title/Category/ID/Date/Status) را main روی thread می‌نویسد؛ ادمین فقط می‌خواند.
   برچسب دسته از snapshot خود thread (categoryLabel) می‌آید تا به فهرست دسته‌های main وابسته نباشیم.
   وضعیت‌های کامل موضوع PHASE 139 است؛ فعلاً فقط 'open'. */
/* PHASE 139 — Ticket Status: چهار وضعیت طبق spec. تغییر وضعیت توسط ادمین موضوع PHASE 140 است؛ این فاز مدل،
   نمایش، و رفتار «تیکت بسته» را می‌سازد. وضعیت ناشناخته/خراب همیشه «باز» نمایش داده می‌شود. */
const SUPPORT_STATUS_META = {
  open:        {label:'باز',          color:'var(--coral)'},
  in_progress: {label:'در حال بررسی', color:'var(--gold)'},
  resolved:    {label:'حل‌شده',        color:'var(--green)'},
  closed:      {label:'بسته',         color:'var(--ink-faint)'},
};
function supportStatusNorm(s){ return SUPPORT_STATUS_META[s] ? s : 'open'; }
function supportStatusLabel(s){ return SUPPORT_STATUS_META[supportStatusNorm(s)].label; }
/* «وضعیت: X» به‌صورت یک span واحد (تا متن پیوسته بماند) با رنگ وضعیت */
function supportStatusInline(s){
  const k = supportStatusNorm(s);
  return `<span>وضعیت: <span style="font-weight:700;color:${SUPPORT_STATUS_META[k].color};">${SUPPORT_STATUS_META[k].label}</span></span>`;
}
function loadSupportChatAdmin(){
  try{
    const raw = window.localStorage.getItem(SUPPORT_CHAT_KEY);
    const d = raw ? JSON.parse(raw) : null;
    if(d && typeof d==='object' && d.threads && typeof d.threads==='object' && !Array.isArray(d.threads)) return d;
  }catch(e){}
  return {threads:{}};
}
function saveSupportChatAdmin(d){
  try{ window.localStorage.setItem(SUPPORT_CHAT_KEY, JSON.stringify(d)); return true; }catch(e){ return false; }
}
function supportFmtDT(ts){
  if(!ts) return '';
  try{
    const dt = new Date(ts);
    const iso = adminLocalISO(ts); // محلی: با toISOString (UTC) در ۰۰:۰۰–۰۳:۳۰ تاریخ یک روز عقب می‌ماند و با ساعت ناسازگار می‌شد
    return adminFmtJalali(iso) + ' · ' + dt.toLocaleTimeString('fa-IR',{hour:'2-digit',minute:'2-digit'});
  }catch(e){ return ''; }
}
/* لیست کارت‌ها: کاربرانی که حداقل یک پیام (غیر از حذف‌شده‌ی خودشان) دارند. */
function supportInboxItem(uid, t, byId, isHistory){
  if(!t || !Array.isArray(t.messages)) return null;
  const msgs = t.messages.filter(m=>m && m.id && m.from);
  if(!msgs.length) return null;
  const u = byId[uid];
  const liveName = u ? ((u.firstName||'')+' '+(u.lastName||'')).trim() : '';
  const lastUser = [...msgs].reverse().find(m=>m.from==='user' && !m.deletedBy) || null;
  const lastAny = msgs[msgs.length-1];
  /* «منتظر پاسخ»: آخرین پیامِ «معنادار» گفت‌وگو از کاربر است. پیام حذف‌شده (tombstone) جزو گفت‌وگوی
     واقعی نیست؛ وگرنه اگر ادمین پیام «بعدی» کاربر را حذف کند، سؤال بی‌پاسخِ قبلی «پاسخ داده شد» می‌شد.
     PHASE 139: تیکت «بسته» هرگز منتظر پاسخ نیست. */
  const meaningful = msgs.filter(m=>!m.deletedBy);
  const lastMeaningful = meaningful[meaningful.length-1] || null;
  const status = supportStatusNorm(t.status);
  const awaiting = status!=='closed' && !!lastMeaningful && lastMeaningful.from==='user';
  const firstUserMsg = msgs.find(m=>m.from==='user' && !m.deletedBy);
  const ticketId = t.ticketId || ('TKT-' + String(uid).replace(/[^a-z0-9]/gi,'').slice(-6).toUpperCase());
  const title = (t.title && String(t.title).trim()) || (firstUserMsg ? String(firstUserMsg.text||'').trim().slice(0,40) : 'بدون عنوان');
  const senderRole = String(t.senderRole || (t.user && t.user.role) || (u && u.role) || 'USER').toUpperCase();
  const senderRoleLabel = senderRole==='SERVICE_MANAGER' ? 'مدیر خدمت' : senderRole==='SUPER_ADMIN' ? 'مدیر اصلی' : 'کاربر';
  return {
    key: isHistory ? ('hist:' + ticketId) : uid,      // کلید باز/بسته‌شدن کارت؛ تیکت‌های تاریخچه با تیکت جاری همان کاربر قاطی نمی‌شوند
    isHistory, readOnly: isHistory || status==='closed',
    userId: uid, ticketId, title, senderRole, senderRoleLabel,
    category: t.category || 'other',
    categoryLabel: t.categoryLabel || 'سایر',
    status,
    createdAt: t.createdAt || (msgs[0] && msgs[0].at) || 0,
    closedAt: t.closedAt || 0,
    name: liveName || (t.user && t.user.name) || '—',
    phone: (u && u.phone) || (t.user && t.user.phone) || '',
    messages: msgs, lastUser, lastAt: lastAny.at||0, awaiting,
    userUnansweredCount: (()=>{ let n=0; for(let i=msgs.length-1;i>=0;i--){ if(msgs[i].from==='admin') break; if(msgs[i].from==='user' && !msgs[i].deletedBy) n++; } return n; })(),
  };
}
/* هر کاربر «یک تیکت جاری» (threads[userId]) و صفر یا چند «تیکت بسته‌ی قبلی» (closed[userId]) دارد؛
   هر دو در صندوق دیده می‌شوند (تاریخچه فقط‌خواندنی). */
function loadSupportInbox(){
  const d = loadSupportChatAdmin();
  const snap = readMainSnapshot();
  const known = (snap.knownUsers && typeof snap.knownUsers==='object') ? snap.knownUsers : {};
  const byId = {};
  Object.keys(known).forEach(ph=>{ const u=known[ph]; if(u&&u.id) byId[u.id] = Object.assign({phone:ph}, u); });
  const out = [];
  Object.keys(d.threads).forEach(uid=>{ const it = supportInboxItem(uid, d.threads[uid], byId, false); if(it) out.push(it); });
  const closed = (d.closed && typeof d.closed==='object' && !Array.isArray(d.closed)) ? d.closed : {};
  Object.keys(closed).forEach(uid=>{
    (Array.isArray(closed[uid]) ? closed[uid] : []).forEach(t=>{ const it = supportInboxItem(uid, t, byId, true); if(it) out.push(it); });
  });
  // باز/در جریان‌ها اول (منتظر پاسخ‌ها بالاتر، بعد جدیدترین)؛ بسته‌ها آخر
  return out.sort((a,b)=> (Number(a.status==='closed')-Number(b.status==='closed')) || (Number(b.awaiting)-Number(a.awaiting)) || (b.lastAt-a.lastAt));
}

        <select onchange="Actions.setSupportFilter('status', this.value)">
          <option value="">همه</option>
          <option value="awaiting" ${filter.status==='awaiting'?'selected':''}>منتظر پاسخ</option>
          <option value="answered" ${filter.status==='answered'?'selected':''}>پاسخ‌داده‌شده</option>
        </select></div>
      <div class="section-title">گفت‌وگوها <span class="hint">${items.length.toLocaleString('fa-IR')} از ${all.length.toLocaleString('fa-IR')}</span></div>
      ${items.length ? items.map(c=>supportCardHTML(c)).join('') : sfAdminEmptyCompact(all.length ? 'با این فیلتر موردی پیدا نشد.' : 'هنوز تیکت پشتیبانی ثبت نشده است.', {icon:all.length?'search':'mail',title:all.length?'گفت‌وگویی با این فیلتر پیدا نشد':'هنوز تیکتی ثبت نشده است.'})}

  sfAdminSaveSeatConfig(mgrId){
    if(!requirePermission(PERMISSIONS.SERVICES_MANAGE,'عملیات sfAdminSaveSeatConfig')) return;
    loadServiceManagers();loadCatalog();
    const m=STATE.serviceManagers.find(x=>x.id===mgrId),err=document.getElementById('sfAdminSeatErr');
    if(!m||!m.serviceId)return;
    const item=assignableItemsFor('transport',m.destId).find(x=>String(x.id)===String(m.serviceId));if(!item)return;
    const layout=document.getElementById('sfAdminSeatLayout')?.value,capacity=parseInt(document.getElementById('sfAdminSeatCapacity')?.value,10);
    const claims=sfAdminSeatClaims(item,m.destId),sold=Object.keys(claims).map(Number).filter(Number.isFinite);

    if(sold.some(n=>n>capacity)){if(err){err.textContent='تعداد صندلی نمی‌تواند کمتر از شماره صندلی‌های خریداری‌شده باشد.';err.style.display='block';}return;}
    const old=sfAdminGetConfig(m.destId,item);
    sfAdminSetConfig(m.destId,item,{layout,capacity,blockedSeatIds:(old.blockedSeatIds||[]).filter(x=>parseInt(x,10)<=capacity)});

  closeSupportThread(){ STATE._supOpen = null; STATE._supEditMsg = null; render(); },
  /* PHASE 140 — Admin Support: status transition is a real persistent action, not UI-only. */
  setSupportStatus(userId, nextStatus){
    if(!SUPPORT_STATUS_META[nextStatus]) return;
    const d = loadSupportChatAdmin();
    const t = d.threads[userId];
    if(!t || !Array.isArray(t.messages)){ Toast.show('تیکت پیدا نشد.', 'error'); return; }
    const before = { status: supportStatusNorm(t.status), closedAt: t.closedAt || 0 };
    const current = before.status;
    if(current === nextStatus) return;
    if(current === 'closed' && nextStatus !== 'closed'){
      Toast.show('تیکت بسته قابل بازگشایی از این مسیر نیست؛ کاربر برای موضوع جدید تیکت تازه می‌سازد.', 'warning');
      render(); return;
    }
    t.status = nextStatus;
    if(nextStatus === 'closed') t.closedAt = Date.now();
    else delete t.closedAt;
    if(!saveSupportChatAdmin(d)){ Toast.show('ذخیره وضعیت ناموفق بود.', 'error'); return; }
    adminAudit('SUPPORT_STATUS_CHANGE','SUPPORT_TICKET',t.ticketId || userId,before,{status:nextStatus,closedAt:t.closedAt||0},'تغییر وضعیت تیکت پشتیبانی',{userId,fromStatus:current,toStatus:nextStatus});
    Toast.show('وضعیت تیکت به «'+SUPPORT_STATUS_META[nextStatus].label+'» تغییر کرد.', 'success');
    STATE._supOpen = nextStatus==='closed' ? null : userId;
    STATE._supEditMsg = null;
    render();
  },

/* ==================== PHASE 145C — Automatic shared-localStorage bridge ====================
   مسیر سازگاری قدیمی حفظ می‌شود: هر دو فایل روی یک Origin از کلیدهای مشترک
   استفاده می‌کنند. نیازی به بازکردن سفریار از داخل ادمین، دکمهٔ اتصال،
   window.opener، BroadcastChannel یا heartbeat نیست. */
window.__sefaryarAdminConnection={connected:false,lastSync:0,source:'shared-localStorage',mode:'shared-localStorage'};
function sfAdminRefreshSharedConnection(){
  try{
    const available=!!(window.localStorage && window.localStorage.getItem(MAIN_STORAGE_KEY)!==null);
    window.__sefaryarAdminConnection.connected=available;
    window.__sefaryarAdminConnection.lastSync=available?Date.now():0;
    window.__sefaryarAdminConnection.source='shared-localStorage';
    return available;
  }catch(e){
    window.__sefaryarAdminConnection.connected=false;
    window.__sefaryarAdminConnection.lastSync=0;
    return false;
  }
}

<script id="sf-admin-phase-149-skeleton-js">
/* ==================== PHASE 149 — Admin Skeleton Controller ==================== */
(function(){
  const ROUTES=new Set(['dashboard','services-global','bookings-global','payments-global','refunds-global','wallet-global','alerts-global','feedback-global','faq-global','support-inbox','bug-reports','security-verification','security-discrepancies','admin-audit-log','manager-requests']);
  let lastRoute=''; let timer=null; let seq=0;
  function denied(route){try{const req=routePermission(route);return !!(AUTH?.loggedIn&&req&&!hasPermission(req));}catch(e){return false;}}
  function build(route){
    const count=route==='dashboard'?4:0;
    const extra=count?`<div class="sf-adm-skel-grid">${Array.from({length:count},()=>`<div class="sf-adm-skel-card"><div class="sf-adm-skel-line w70"></div><div class="sf-adm-skel-line w38"></div></div>`).join('')}</div>`:'';
    return `<div class="sf-adm-skel-page" role="status" aria-live="polite" aria-label="در حال آماده‌سازی پنل مدیریت"><div class="sf-adm-skel-head"><div class="sf-adm-skel-circle"></div><div class="sf-adm-skel-main"><div class="sf-adm-skel-line w1"></div><div class="sf-adm-skel-line w2"></div></div></div><div class="sf-adm-skel-title"></div>${extra}<div class="sf-adm-skel-card"><div class="sf-adm-skel-line w52"></div><div class="sf-adm-skel-line w70"></div><div class="sf-adm-skel-row"><div class="sf-adm-skel-pill"></div><div class="sf-adm-skel-pill"></div></div></div><div class="sf-adm-skel-card"><div class="sf-adm-skel-box"></div><div class="sf-adm-skel-line w70"></div><div class="sf-adm-skel-line w52"></div><div class="sf-adm-skel-line w38"></div></div><div class="sf-adm-skel-card"><div class="sf-adm-skel-line w52"></div><div class="sf-adm-skel-line w70"></div><div class="sf-adm-skel-line w38"></div></div></div>`;
  }
  const originalRender=window.render;
  if(typeof originalRender!=='function') return;
  window.render=function(){
    const route=String(STATE?.route||'dashboard');
    if(AUTH?.loggedIn&&ROUTES.has(route)&&!denied(route)&&route!==lastRoute){
      const app=document.getElementById('app');
      if(app){
        if(timer) clearTimeout(timer);
        const token=++seq;
        lastRoute=route;
        app.setAttribute('aria-busy','true');
        app.innerHTML=build(route);
        timer=setTimeout(function(){if(token!==seq)return;timer=null;app.removeAttribute('aria-busy');originalRender();},320);
        return;
      }
    }
    originalRender();
  };
  window.sfAdminPhase149Skeleton={reset:function(){lastRoute='';},routes:Array.from(ROUTES),isActive:function(){return !!timer;}};
})();
</script>




<script id="sf-phase151-error-state-js">
(function(){
  'use strict';
  if(window.sfPhase151ErrorState) return;
  var overlay=null, lastErrorKey='', lastErrorAt=0;
  function safeText(value, fallback){
    var s=String(value==null?'':value).trim();
    return s || fallback;
  }
  function ensureOverlay(){
    if(overlay && overlay.isConnected) return overlay;
    overlay=document.createElement('div');
    overlay.className='sf-error-overlay'; overlay.hidden=true;
    overlay.setAttribute('role','alertdialog'); overlay.setAttribute('aria-modal','true');
    overlay.setAttribute('aria-labelledby','sfPhase151ErrorTitle');
    overlay.innerHTML='<div class="sf-error-overlay__card"><div class="sf-error-state"><div class="sf-error-state__icon" aria-hidden="true">!</div><div class="sf-error-state__body"><h2 class="sf-error-state__title" id="sfPhase151ErrorTitle">مشکلی پیش آمد</h2><p class="sf-error-state__message" id="sfPhase151ErrorMessage">در انجام این کار مشکلی رخ داد. اطلاعات ذخیره‌شده شما حذف نشده است.</p><div class="sf-error-state__actions"><button type="button" class="sf-error-state__retry" data-sf-error-retry>تلاش دوباره</button><button type="button" class="sf-error-state__back" data-sf-error-close>بستن</button></div></div></div></div>';
    document.body.appendChild(overlay);
    overlay.addEventListener('click',function(e){
      if(e.target===overlay || e.target.closest('[data-sf-error-close]')) hide();
      if(e.target.closest('[data-sf-error-retry]')){
        hide();
        try { if(typeof window.sfPhase151Retry==='function') window.sfPhase151Retry(); else window.location.reload(); }
        catch(_){ window.location.reload(); }
      }
    });
    overlay.addEventListener('keydown',function(e){if(e.key==='Escape')hide();});
    return overlay;
  }
  function show(options){
    options=options||{};
    var host=ensureOverlay();
    var title=safeText(options.title,'مشکلی پیش آمد');
    var message=safeText(options.message,'در انجام این کار مشکلی رخ داد. اطلاعات ذخیره‌شده شما حفظ شده است؛ لطفاً دوباره تلاش کنید.');
    var titleEl=host.querySelector('#sfPhase151ErrorTitle'), messageEl=host.querySelector('#sfPhase151ErrorMessage');
    if(titleEl) titleEl.textContent=title;
    if(messageEl) messageEl.textContent=message;
    var retry=host.querySelector('[data-sf-error-retry]');
    if(retry) retry.textContent=safeText(options.retryLabel,'تلاش دوباره');
    var close=host.querySelector('[data-sf-error-close]');
    if(close) close.textContent=safeText(options.closeLabel,'بستن');
    host.hidden=false;
    if(retry) setTimeout(function(){try{retry.focus({preventScroll:true});}catch(_){retry.focus();}},0);
    return host;
  }
  function hide(){if(overlay)overlay.hidden=true;}
  function render(options){
    options=options||{};
    var wrap=document.createElement('section'); wrap.className='sf-error-state'; wrap.setAttribute('role','alert');
    var icon=document.createElement('div');icon.className='sf-error-state__icon';icon.setAttribute('aria-hidden','true');icon.textContent='!';
    var body=document.createElement('div');body.className='sf-error-state__body';
    var title=document.createElement('h3');title.className='sf-error-state__title';title.textContent=safeText(options.title,'بارگذاری انجام نشد');
    var msg=document.createElement('p');msg.className='sf-error-state__message';msg.textContent=safeText(options.message,'اطلاعات این بخش در حال حاضر در دسترس نیست. می‌توانید دوباره تلاش کنید.');
    var actions=document.createElement('div');actions.className='sf-error-state__actions';
    var retry=document.createElement('button');retry.type='button';retry.className='sf-error-state__retry';retry.textContent=safeText(options.retryLabel,'تلاش دوباره');
    retry.addEventListener('click',function(){try{if(typeof options.onRetry==='function')options.onRetry();else window.location.reload();}catch(_){show({title:'تلاش دوباره ممکن نشد',message:'لطفاً صفحه را دوباره بارگذاری کنید.'});}});
    actions.appendChild(retry);body.appendChild(title);body.appendChild(msg);body.appendChild(actions);wrap.appendChild(icon);wrap.appendChild(body);return wrap;
  }
  function globalError(message){
    var key=safeText(message,'unknown');var now=Date.now();
    if(key===lastErrorKey && now-lastErrorAt<2500)return;
    lastErrorKey=key;lastErrorAt=now;
    show({title:'خطایی غیرمنتظره رخ داد',message:'این بخش به‌درستی اجرا نشد. اطلاعات ذخیره‌شده شما حفظ می‌شود؛ لطفاً دوباره تلاش کنید.'});
  }
  window.sfShowErrorState=show;
  window.sfHideErrorState=hide;
  window.sfRenderErrorState=render;
  window.sfPhase151ErrorState={show:show,hide:hide,render:render};
  window.addEventListener('error',function(e){
    if(e && e.message) globalError(e.message);
  });
  window.addEventListener('unhandledrejection',function(e){
    globalError(e && e.reason && (e.reason.message||String(e.reason)) || 'unhandled rejection');
  });
})();
</script>


<script id="sf-phase152-success-state-js">
/* PHASE 152 — shared success-state API adapted to the Admin Toast component. */
(function(){
  'use strict';
  if(window.sfPhase152SuccessState) return;
  var DEFAULT_TITLE='عملیات با موفقیت انجام شد';
  function safeText(value,fallback){var s=String(value==null?'':value).trim();return s||fallback;}

    body.appendChild(title);body.appendChild(msg);

    section.appendChild(icon);section.appendChild(body);
    if(o.dismissible!==false){var close=document.createElement('button');close.type='button';close.className='sf-success-state__dismiss';close.setAttribute('aria-label','بستن پیام موفقیت');close.title='بستن پیام';close.textContent='×';close.addEventListener('click',function(){section.remove();});section.appendChild(close);}
    return section;
  }
  function show(input,extra){var o=normalize(input,extra),message=safeText(o.message||o.description,''),title=String(o.title||'').trim(),text=message;if(title&&message&&title!==DEFAULT_TITLE)text=title+'؛ '+message;else if(!text)text=safeText(title,DEFAULT_TITLE);if(typeof Toast!=='undefined'&&Toast&&typeof Toast.show==='function'){Toast.show(text,'success');return true;}var host=document.getElementById('toast-host');if(host){var node=render({title:title||DEFAULT_TITLE,message:message||text});host.appendChild(node);window.setTimeout(function(){if(node.isConnected)node.remove();},Math.max(1800,Math.min(10000,Number(o.duration)||3200)));return node;}return null;}
  function mount(target,input,extra){var host=typeof target==='string'?document.querySelector(target):target;if(!host||typeof host.appendChild!=='function')return null;Array.prototype.forEach.call(host.querySelectorAll(':scope > .sf-success-state'),function(el){el.remove();});var node=render(input,extra);host.appendChild(node);return node;}
  window.sfShowSuccessState=show;window.sfRenderSuccessState=render;window.sfMountSuccessState=mount;window.sfPhase152SuccessState={show:show,render:render,mount:mount,defaultTitle:DEFAULT_TITLE};
})();
</script>

    Toast.show('درخواست بازنشانی ثبت شد؛ در حال همگام‌سازی سفریار اصلی…','info');

<script id="sf-phase161-data-health-backup-admin">
/* PHASE 161 ENHANCEMENTS — local data health, validated export/import.

(function(){

  var MAIN_KEY='sefaryar_demo_state_v1';

  function openIDB(){return new Promise(function(resolve){try{if(!window.indexedDB){resolve(null);return;}var req=indexedDB.open('sefaryar_demo_db_v1',1);req.onupgradeneeded=function(){var db=req.result;if(!db.objectStoreNames.contains('state'))db.createObjectStore('state');};req.onsuccess=function(){resolve(req.result);};req.onerror=function(){resolve(null);};req.onblocked=function(){resolve(null);};}catch(_){resolve(null);}});}

  function download(name,content,type){var blob=new Blob([content],{type:type||'application/json;charset=utf-8'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(function(){URL.revokeObjectURL(url);},1600);}
  function setReport(text,kind){var e=document.getElementById('sf161-health-report');if(e){e.textContent=text;e.dataset.kind=kind||'info';e.style.display='block';}}

      setReport('پشتیبان با موفقیت ساخته شد. '+Object.keys(data.storage).length+' کلید داده در فایل قرار گرفت. کلید احراز هویت پنل ادمین و نشانگرهای موقت/بازنشانی در خروجی قرار نگرفتند.','success');return true;
    }catch(e){setReport('ساخت پشتیبان ناموفق بود: '+(e&&e.message||'خطای ذخیره‌سازی'),'error');return false;}
  }
  function validateBackup(data){

    if(!data.storage[MAIN_KEY])throw new Error('فایل پشتیبان Snapshot اصلی سفریار را ندارد.');

    var file=input&&input.files&&input.files[0];if(!file)return;
    try{
      if(file.size>25*1024*1024)throw new Error('حجم فایل بیش از حد مجاز ۲۵ مگابایت است.');
      var text=await file.text(),data=JSON.parse(text),check=validateBackup(data);
      var message='این پشتیبان شامل '+check.keys+' کلید داده و '+check.trips+' سفر است.\nداده‌های هم‌نام فعلی جایگزین می‌شوند. کلیدهایی که در فایل نیستند حذف نمی‌شوند.\nنشست ورود ادمین حفظ می‌شود. ادامه می‌دهی؟';
      if(!window.confirm(message)){setReport('بازیابی لغو شد؛ داده‌ها تغییری نکردند.','info');input.value='';return;}
      var before={};Object.keys(data.storage).forEach(function(k){before[k]=localStorage.getItem(k);});
      var changed=[];
      try{
        Object.keys(data.storage).forEach(function(k){localStorage.setItem(k,data.storage[k]);changed.push(k);});
      }catch(writeErr){
        changed.reverse().forEach(function(k){try{if(before[k]===null)localStorage.removeItem(k);else localStorage.setItem(k,before[k]);}catch(_){}});
        throw new Error('ذخیره‌سازی کامل نشد؛ تغییرات محلی تا حد امکان به وضعیت قبلی بازگردانده شدند. '+(writeErr&&writeErr.message||''));
      }
      var idbOk=false;try{idbOk=await writeIDB(check.snapshot);}catch(_){}
      changed.forEach(function(k){try{window.dispatchEvent(new StorageEvent('storage',{key:k,oldValue:before[k],newValue:data.storage[k],storageArea:localStorage,url:location.href}));}catch(_){}});
      setReport('بازیابی انجام شد. '+changed.length+' کلید وارد شد و نشست ورود ادمین حفظ شد. '+(idbOk?'نسخهٔ IndexedDB نیز با Snapshot بازیابی‌شده همگام شد.':'همگام‌سازی IndexedDB تأیید نشد؛ دادهٔ اصلی LocalStorage بازیابی شده است.')+' برای بازخوانی کامل صفحات، سفریار و ادمین را Refresh کن.','success');
      if(typeof render==='function')render();
    }catch(e){setReport('بازیابی انجام نشد: '+(e&&e.message||'فایل پشتیبان نامعتبر است'),'error');}
    finally{try{input.value='';}catch(_){}}
  }
  function runDiagnostics(){
    var lines=[],issues=[],warnings=[],snap=null,keys=relevantKeys(),tripIds=new Set(),bookingIds=new Set(),dups=0,bookingCount=0,orphanPayments=0,negativeValues=0,duplicatePhones=0;
    var storageOk=false;try{var k='__sf161_health_probe__';localStorage.setItem(k,'1');localStorage.removeItem(k);storageOk=true;}catch(_){issues.push('LocalStorage قابل نوشتن نیست.');}
    if(!storageOk)lines.push('❌ ذخیره‌سازی مرورگر: در دسترس نیست');else lines.push('✅ ذخیره‌سازی مرورگر: قابل خواندن و نوشتن');
    try{snap=getMainSnapshot();lines.push('✅ Snapshot اصلی: JSON معتبر');}catch(e){issues.push('Snapshot اصلی قابل خواندن نیست: '+(e.message||''));lines.push('❌ Snapshot اصلی: نامعتبر');}
    var badJson=[];keys.forEach(function(k){try{var v=localStorage.getItem(k);if(v==null)return;if(/demo_state|catalog|plans|support_chat|seat_configs|audit_log|manager|alerts|faq|feedback|wallet|refund|payment|notification/i.test(k))JSON.parse(v);}catch(_){badJson.push(k);}});
    if(badJson.length){issues.push('کلیدهای JSON نامعتبر: '+badJson.join(', '));lines.push('❌ JSON نامعتبر در '+badJson.length+' کلید');}else lines.push('✅ کلیدهای ساختاری JSON: معتبر');
    if(snap){
      var trips=Array.isArray(snap.trips)?snap.trips:[];trips.forEach(function(t){if(!t||!t.id){issues.push('یک سفر بدون شناسه وجود دارد.');return;}if(tripIds.has(String(t.id))){dups++;issues.push('شناسهٔ سفر تکراری: '+t.id);}tripIds.add(String(t.id));
        ['tickets','hotels','tours','food','attractions','carRentals'].forEach(function(a){(Array.isArray(t[a])?t[a]:[]).forEach(function(b){if(!b||!b.id){issues.push('رزرو بدون شناسه در سفر '+t.id);return;}if(bookingIds.has(String(b.id))){dups++;issues.push('شناسهٔ رزرو تکراری: '+b.id);}bookingIds.add(String(b.id));bookingCount++;['total','price','refundAmount'].forEach(function(f){if(b[f]!=null&&Number(b[f])<0){negativeValues++;issues.push('مقدار منفی '+f+' در رزرو '+b.id);}});});});
      });
      (Array.isArray(snap.payments)?snap.payments:[]).forEach(function(p){if(p&&p.bookingId&&!bookingIds.has(String(p.bookingId))&&p.status!=='topup'){orphanPayments++;warnings.push('پرداخت دارای bookingId بدون رزرو قابل یافتن: '+p.id);}});
      var managers=Array.isArray(snap.serviceManagers)?snap.serviceManagers:[],phones=new Set();managers.forEach(function(m){if(!m||!m.phone)return;if(phones.has(String(m.phone))){duplicatePhones++;issues.push('شمارهٔ تکراری مدیر خدمات: '+m.phone);}phones.add(String(m.phone));});
      lines.push('سفرها: '+trips.length+' · رزروها: '+bookingCount+' · پرداخت‌ها: '+(Array.isArray(snap.payments)?snap.payments.length:0)+' · مدیران خدمات: '+managers.length);
    }
    lines.push('کلیدهای مشترک داده: '+keys.length);
    if(issues.length)lines.push('\nموارد نیازمند بررسی:\n• '+issues.slice(0,30).join('\n• '));
    if(warnings.length)lines.push('\nهشدارهای بررسی دستی:\n• '+warnings.slice(0,20).join('\n• '));
    if(!issues.length&&!warnings.length)lines.push('\n✅ مورد ناسازگار مشخصی در بررسی ایستا پیدا نشد.');
    lines.push('\nاین بررسی خودکار است؛ نبود هشدار به معنی تضمین کامل صحت کسب‌وکار همهٔ رزروها نیست.');
    setReport(lines.join('\n'),issues.length?'error':(warnings.length?'warning':'success'));
    return {pass:issues.length===0,issues:issues,warnings:warnings,keys:keys.length,trips:snap&&Array.isArray(snap.trips)?snap.trips.length:0,bookings:bookingCount,paymentsOrphaned:orphanPayments,duplicates:dups,negativeValues:negativeValues,duplicateManagerPhones:duplicatePhones};
  }
  function mount(){
    var app=document.getElementById('app');if(!app)return;
    var h=app.querySelector('.topbar h1');if(!h||String(h.textContent||'').trim()!=='تنظیمات مدیر اصلی')return;
    var page=app.querySelector('.page');if(!page||document.getElementById('sf161-data-health-card'))return;
    var wrap=document.createElement('section');wrap.id='sf161-data-health-card';wrap.className='card';wrap.style.marginTop='14px';
    wrap.innerHTML='<div class="opt-title">سلامت داده‌ها و پشتیبان‌گیری</div><div class="opt-meta" style="line-height:1.9">پشتیبان محلی شامل داده‌های سفریار و پنل ادمین در همین مبدأ است؛ کلید احراز هویت ادمین و نشانگرهای موقت/بازنشانی در فایل قرار نمی‌گیرند. اطلاعات پروفایل، سفر و مسافران ممکن است داخل پشتیبان باشند؛ فایل را در جای امن نگه دار.</div><div class="card-actions"><button type="button" class="btn btn-primary btn-sm" id="sf161-backup-create">دانلود پشتیبان</button><button type="button" class="btn btn-outline btn-sm" id="sf161-health-run">بررسی سلامت داده‌ها</button><button type="button" class="btn btn-ghost btn-sm" id="sf161-backup-choose">بازیابی از فایل</button><input id="sf161-backup-file" type="file" accept="application/json,.json" style="display:none"></div><pre id="sf161-health-report" role="status" aria-live="polite" style="display:none;white-space:pre-wrap;word-break:break-word;font-family:inherit;font-size:12px;line-height:1.9;background:var(--surface-alt);padding:12px;border-radius:12px;margin-top:12px"></pre><div class="opt-meta" style="margin-top:8px">بازیابی فقط پس از بررسی ساختار فایل و تأیید صریح انجام می‌شود. کلیدهای حذف‌شده از پشتیبان پاک نمی‌شوند و کلیدهای مشترک تغییر نام نمی‌دهند.</div>';
    page.appendChild(wrap);
    wrap.querySelector('#sf161-backup-create').addEventListener('click',makeBackup);
    wrap.querySelector('#sf161-health-run').addEventListener('click',function(){var r=runDiagnostics(),el=document.getElementById('sf161-health-report');if(el)el.style.display='block';});
    var file=wrap.querySelector('#sf161-backup-file');wrap.querySelector('#sf161-backup-choose').addEventListener('click',function(){file.click();});file.addEventListener('change',function(){var el=document.getElementById('sf161-health-report');if(el)el.style.display='block';restoreFromInput(file);});
  }
  var observer=new MutationObserver(function(){mount();});
  function start(){var app=document.getElementById('app');if(app)observer.observe(app,{childList:true,subtree:true});mount();}
  if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',start,{once:true});else start();
  window.SefaryarDataHealth161={phase:161,runDiagnostics:runDiagnostics,createBackup:makeBackup,restoreFromInput:restoreFromInput,validateBackup:validateBackup,audit:function(){var keys=relevantKeys();return {phase:161,pass:MAIN_KEY==='sefaryar_demo_state_v1'&&ADMIN_AUTH==='sefaryar_admin_auth_v1',mainKeyPreserved:MAIN_KEY==='sefaryar_demo_state_v1',catalogKeyPreserved:keys.indexOf('sefaryar_admin_catalog_v1')>=0||localStorage.getItem('sefaryar_admin_catalog_v1')===null,supportKeyPreserved:keys.indexOf('sefaryar_support_chat_v1')>=0||localStorage.getItem('sefaryar_support_chat_v1')===null,excludesAdminAuth:true,hasBackupUI:!!document.getElementById('sf161-data-health-card'),relevantKeys:keys.length};}};
})();
</script>
