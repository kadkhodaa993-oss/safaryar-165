<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, viewport-fit=cover">
<title>سفریار | پنل مدیر اصلی</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/* ==================== safaryar-admin — پنل مدیر اصلی (اپلیکیشن جدا) ====================
   این فایل عمداً کاملاً مستقل از safaryar.html است (فایل دیگر، Route دیگر،
   بدون هیچ <script src> مشترک) — اما هر دو از یک Origin باز می‌شوند، پس از
   همان کلیدهای localStorage به‌عنوان «پل داده» مشترک استفاده می‌کنند:
     - sefaryar_demo_state_v1   → شامل serviceManagers (خواندنی/نوشتنی از اینجا)
     - sefaryar_admin_catalog_v1 → کاتالوگ خدمات جدید (رستوران/هتل/تور/جاذبه/
       حمل‌ونقل) که مدیر اصلی اینجا اضافه می‌کند؛ safaryar.html این کلید را
       می‌خواند و آیتم‌ها را داخل DB خودش ادغام می‌کند (PHASE 113 در آن فایل).
     - sefaryar_admin_auth_v1   → Session مستقل خودِ همین پنل (شماره + رمز)،
       کاملاً جدا از STATE.user در فایل اصلی؛ ورود به یکی، ورود به دیگری
       نیست.
   رنگ‌ها/فونت/کارت‌ها دقیقاً از همان پالت safaryar.html کپی شده تا دو اپ از
   نظر بصری یک خانواده به‌نظر برسند. */
:root{
  --bg:#F7F5EE;
  --surface:#FFFFFF;
  --surface-alt:#EFEAE0;
  --ink:#16302E;
  --ink-soft:#5B7370;
  --ink-faint:#8CA09D;
  --primary:#0E6E6A;
  --primary-dark:#0A4F4C;
  --primary-tint:#E4F1EF;
  --gold:#C9972E;
  --gold-tint:#FBF1DD;
  --coral:#C1533A;
  --coral-tint:#FBEAE6;
  --green:#2E8B47;
  --green-tint:#E7F5EA;
  --border:#E1DACB;
  --radius:16px;
  --radius-sm:10px;
  --shadow:0 6px 20px rgba(15,60,58,.08);
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  font-family:'Vazirmatn',Tahoma,sans-serif;
  background:var(--bg);
  color:var(--ink);
  -webkit-font-smoothing:antialiased;
  min-height:100vh;
}
a{color:inherit;text-decoration:none;}
button{font-family:inherit;cursor:pointer;}
input,select,textarea{font-family:inherit;}
::selection{background:var(--gold-tint);}

#app-shell{
  max-width:480px;margin:0 auto;min-height:100vh;background:var(--bg);
  position:relative;padding-bottom:28px;box-shadow:0 0 40px rgba(0,0,0,.06);
}
@media(min-width:520px){
  #app-shell{ margin-top:12px; margin-bottom:12px; min-height:calc(100vh - 24px); border-radius:28px; overflow:hidden;}
}

.topbar{
  position:sticky;top:8px;z-index:50;
  margin:8px 4% 10px;
  background:var(--surface);
  border:1px solid var(--border);
  border-radius:18px;
  box-shadow:var(--shadow);
  padding:12px 14px;
  display:flex;align-items:center;gap:10px;
  overflow:hidden;
}
.topbar::before{
  content:'';position:absolute;top:0;left:-40%;width:35%;height:100%;
  background:linear-gradient(90deg, transparent, var(--gold) 45%, var(--primary) 65%, transparent 100%);
  opacity:.55;transform:skewX(-20deg);
  animation:topbar-sweep 7s ease-in-out infinite;
  pointer-events:none;filter:blur(2px);
}
@keyframes topbar-sweep{ 0%{left:-40%;} 45%{left:110%;} 100%{left:110%;} }
.topbar .back-btn{
  position:relative;z-index:1;width:34px;height:34px;border-radius:50%;
  border:1px solid var(--border);background:var(--surface);
  display:flex;align-items:center;justify-content:center;font-size:16px;color:var(--primary-dark);flex-shrink:0;
}
.topbar h1{position:relative;z-index:1;font-size:16px;font-weight:700;margin:0;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.topbar .top-sub{position:relative;z-index:1;font-size:11px;color:var(--ink-faint);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
@media (prefers-reduced-motion: reduce){ .topbar::before{ animation:none; opacity:0; } }
/* ==================== SECURITY MISSION — Verification / Discrepancy / Admin Audit ==================== */
.security-summary{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-bottom:12px;}
.security-stat{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:12px;}
.security-stat b{display:block;font-size:20px;margin-bottom:2px;}
.security-stat span{font-size:11px;color:var(--ink-faint);}
.security-ok{color:var(--green)!important}.security-warn{color:var(--gold)!important}.security-danger{color:var(--coral)!important}
.verify-status{display:flex;align-items:center;gap:8px;border-radius:14px;padding:12px 14px;margin-bottom:12px;font-weight:800;}
.verify-status.ok{background:var(--green-tint);color:var(--green)}
.verify-status.warn{background:var(--gold-tint);color:#8a6510}
.verify-status.bad{background:var(--coral-tint);color:var(--coral)}
.verify-status.info{background:var(--primary-tint);color:var(--primary-dark)}
.audit-chip{display:inline-flex;align-items:center;padding:4px 8px;border-radius:9px;background:var(--surface-alt);font-size:10.5px;font-weight:700;}
.discrepancy-row{border-right:4px solid var(--border);}
.discrepancy-row.critical{border-right-color:var(--coral)}
.discrepancy-row.warning{border-right-color:var(--gold)}
.discrepancy-row.info{border-right-color:var(--primary)}
.security-code{font-family:monospace;direction:ltr;unicode-bidi:plaintext;font-size:11px;}
@media(min-width:420px){.security-summary{grid-template-columns:repeat(4,minmax(0,1fr));}}


.brandbar{
  position:sticky;top:8px;z-index:50;margin:8px 4% 10px;
  display:flex;align-items:center;justify-content:space-between;
  background:var(--surface);border:1px solid var(--border);border-radius:18px;
  box-shadow:var(--shadow);padding:12px 14px;overflow:hidden;
}
.brandbar::before{
  content:'';position:absolute;top:0;left:-40%;width:35%;height:100%;
  background:linear-gradient(90deg, transparent, var(--gold) 45%, var(--primary) 65%, transparent 100%);
  opacity:.55;transform:skewX(-20deg);
  animation:topbar-sweep 7s ease-in-out infinite;pointer-events:none;filter:blur(2px);
}
.brand{position:relative;z-index:1;display:flex;align-items:center;gap:8px;font-weight:800;font-size:19px;color:var(--primary-dark);}
.brand .logo-dot{width:10px;height:10px;border-radius:3px;background:var(--gold);display:inline-block;transform:rotate(45deg);}

.page{padding:16px;animation:fadeIn .25s ease;}
@keyframes fadeIn{ from{opacity:0;transform:translateY(6px);} to{opacity:1;transform:translateY(0);} }

.section-title{font-size:15px;font-weight:700;margin:22px 0 10px;display:flex;align-items:center;justify-content:space-between;}
.section-title span.hint{font-size:12px;color:var(--ink-faint);font-weight:500;}

.card{
  background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);
  padding:14px;margin-bottom:12px;box-shadow:var(--shadow);
}
.card-row{display:flex;align-items:center;justify-content:space-between;gap:10px;}
.opt-title{font-weight:700;font-size:14px;margin-bottom:4px;}
.opt-meta{font-size:12px;color:var(--ink-faint);margin-bottom:8px;display:flex;gap:10px;flex-wrap:wrap;}

.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:6px;
  border-radius:12px;padding:13px 16px;font-weight:700;font-size:14px;border:none;width:100%;
  transition:transform .1s;
}
.btn:active{transform:scale(.98);}
.btn-primary{background:var(--primary);color:#fff;}
.btn-primary:hover{background:var(--primary-dark);}
.btn-outline{background:transparent;border:1.5px solid var(--primary);color:var(--primary-dark);}
.btn-ghost{background:var(--surface-alt);color:var(--ink);}
.btn-sm{padding:9px 12px;font-size:13px;width:auto;border-radius:10px;}
.btn-danger{background:var(--coral-tint);color:var(--coral);}
.btn-danger-solid{background:var(--coral);color:#fff;}
.btn:disabled{opacity:.5;pointer-events:none;}

.field{margin-bottom:14px;}
.field label{display:block;font-size:12.5px;font-weight:600;color:var(--ink-soft);margin-bottom:6px;}
.field input, .field select, .field textarea{
  width:100%;padding:12px 14px;border-radius:12px;border:1.5px solid var(--border);
  background:var(--surface);font-size:14px;color:var(--ink);outline:none;
}
.field input:focus, .field select:focus, .field textarea:focus{border-color:var(--primary);}
.field .err{color:var(--coral);font-size:12px;margin-top:5px;display:none;}
.field.invalid input, .field.invalid select{border-color:var(--coral);background:var(--coral-tint);}
.field.invalid .err{display:block;}

.alert{border-radius:12px;padding:12px 14px;font-size:13px;margin-bottom:14px;display:flex;gap:8px;align-items:flex-start;}
.alert.error{background:var(--coral-tint);color:var(--coral);}
.alert.info{background:var(--primary-tint);color:var(--primary-dark);}
.alert.success{background:var(--primary-tint);color:var(--primary-dark);}

/* ---------- کارت‌های گزینه‌ای خدمات (مربعی کشیده، با خط دورشان که مثل
   نوار پایینِ اپ اصلی می‌چرخد) ---------- */
.service-grid{
  display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:6px;
}
.service-card{
  position:relative;
  aspect-ratio:1/1.15; /* مربعی کشیده، طبق درخواست */
  border-radius:18px;
  background:var(--surface);
  overflow:hidden;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;
  padding:14px;text-align:center;
}
.service-card svg.border-line{
  position:absolute;inset:0;width:100%;height:100%;pointer-events:none;overflow:visible;z-index:1;
}
.service-card svg.border-line rect{
  fill:none;stroke:var(--primary);stroke-width:1.5;stroke-linecap:round;
  opacity:.65;filter:drop-shadow(0 0 2px var(--primary));
  stroke-dasharray:6 94;animation:border-travel 6s linear infinite;
}
@keyframes border-travel{ to{ stroke-dashoffset:-100; } }
/* نور شناور: یک باند نور مورب که با فاصله‌ی زمانی (delay) روی سطح هر کارت
   عبور می‌کند — جدا از خط دور کارت (border-line)، این افکت باید حس زنده و
   دلربای «انعکاس نور روی سطح براق» را بدهد، نه صرفاً چشمک‌زدن. */
.service-card .card-sheen{
  position:absolute;inset:0;z-index:1;pointer-events:none;overflow:hidden;border-radius:inherit;
}
.service-card .card-sheen::before{
  content:'';position:absolute;top:-60%;bottom:-60%;left:-35%;width:32%;
  background:linear-gradient(100deg, transparent 0%, rgba(255,255,255,0) 30%, var(--sheen-color,rgba(255,255,255,.55)) 50%, rgba(255,255,255,0) 70%, transparent 100%);
  transform:rotate(10deg);
  animation:card-sheen-sweep 4.5s ease-in-out infinite;
  animation-delay:var(--sheen-delay,0s);
}
@keyframes card-sheen-sweep{
  0%{ left:-45%; opacity:0; }
  8%{ opacity:.9; }
  35%{ opacity:.9; }
  48%{ left:135%; opacity:0; }
  100%{ left:135%; opacity:0; }
}
body.dark .service-card .card-sheen::before, body.theme-dark .service-card .card-sheen::before{
  --sheen-color: rgba(255,255,255,.16);
}
.service-card.tone-gold .card-sheen::before{ --sheen-color: rgba(255,214,140,.55); }
.service-card.tone-coral .card-sheen::before{ --sheen-color: rgba(255,168,150,.55); }
.service-card.tone-green .card-sheen::before{ --sheen-color: rgba(150,230,180,.55); }
.service-card .service-ico{
  position:relative;z-index:2;width:52px;height:52px;border-radius:16px;
  display:flex;align-items:center;justify-content:center;font-size:24px;
  background:var(--primary-tint);color:var(--primary);
}
.service-card.tone-gold .service-ico{background:var(--gold-tint);color:var(--gold);}
.service-card.tone-coral .service-ico{background:var(--coral-tint);color:var(--coral);}
.service-card.tone-green .service-ico{background:var(--green-tint);color:var(--green);}
.service-card .service-name{position:relative;z-index:2;font-weight:800;font-size:14.5px;}
.service-card .service-count{position:relative;z-index:2;font-size:11.5px;color:var(--ink-faint);}
.service-card:active{transform:scale(.97);}
@media (prefers-reduced-motion: reduce){ .service-card svg.border-line rect{ animation:none; } .service-card .card-sheen::before{ animation:none; display:none; } }

.tab-row{display:flex;gap:6px;overflow-x:auto;margin-bottom:14px;}
.tab-btn{padding:9px 14px;border-radius:11px;background:var(--surface-alt);font-size:12.5px;font-weight:700;color:var(--ink-soft);white-space:nowrap;border:none;}
.tab-btn.active{background:var(--primary);color:#fff;}

.pin-boxes{display:flex;gap:8px;justify-content:center;direction:ltr;margin:18px 0 6px;}
.pin-boxes input{
  width:46px;height:54px;text-align:center;font-size:20px;font-weight:800;
  border-radius:12px;border:1.5px solid var(--border);background:var(--surface);color:var(--ink);
}
.pin-boxes input:focus{border-color:var(--primary);outline:none;}

.login-wrap{padding:26px 20px;min-height:100vh;display:flex;flex-direction:column;justify-content:center;}
.login-logo{display:flex;align-items:center;justify-content:center;gap:8px;font-weight:800;font-size:22px;color:var(--primary-dark);margin-bottom:6px;}
.login-logo .logo-dot{width:11px;height:11px;border-radius:3px;background:var(--gold);display:inline-block;transform:rotate(45deg);}
.login-sub{text-align:center;font-size:13px;color:var(--ink-faint);margin-bottom:28px;}

.divider{height:1px;background:var(--border);margin:10px 0;}

/* ---------------------- PHASE A1 — Confirmation Dialog (Modal عمومی) ---------------------- */
.modal-overlay{
  position:fixed;inset:0;background:rgba(15,30,28,.5);z-index:200;
  display:flex;align-items:flex-end;justify-content:center;
  animation:overlayFadeIn .2s ease;
}
@keyframes overlayFadeIn{ from{opacity:0;} to{opacity:1;} }
.modal-sheet{
  background:var(--surface);width:100%;max-width:480px;border-radius:20px 20px 0 0;
  padding:20px 18px calc(18px + env(safe-area-inset-bottom));
  animation:sheetSlideUp .25s ease;max-height:88vh;overflow-y:auto;
}
@media(min-width:520px){
  .modal-overlay{align-items:center;}
  .modal-sheet{border-radius:20px;max-width:420px;margin:0 16px;}
}
@keyframes sheetSlideUp{ from{transform:translateY(24px);opacity:0;} to{transform:translateY(0);opacity:1;} }
.modal-sheet h3{margin:0 0 8px;font-size:16px;font-weight:800;}
.modal-sheet p{margin:0 0 18px;font-size:13.5px;color:var(--ink-soft);line-height:1.9;}
.modal-actions{display:flex;gap:10px;}
.modal-actions .btn{flex:1;}
.modal-handle{width:38px;height:4px;border-radius:2px;background:var(--border);margin:0 auto 16px;}
@media(min-width:520px){ .modal-handle{display:none;} }

/* ---------------------- PHASE A1 — Toast System ---------------------- */
/* PHASE 154 — Toast System: unified feedback states and accessible controls */
#toast-host{
  position:fixed;bottom:max(18px,env(safe-area-inset-bottom));left:0;right:0;z-index:10050;
  display:flex;flex-direction:column;align-items:center;gap:8px;pointer-events:none;
  padding:0 12px;direction:rtl;max-height:calc(100vh - 32px);overflow:visible;
}
.toast{
  position:relative;overflow:hidden;pointer-events:auto;max-width:420px;width:100%;
  background:var(--ink);color:#fff;border:1px solid rgba(255,255,255,.16);border-radius:13px;padding:11px 12px 13px;
  font-size:13px;font-weight:600;display:flex;align-items:center;gap:9px;line-height:1.75;
  box-shadow:0 8px 24px rgba(0,0,0,.22);animation:toastIn .22s ease both;word-break:break-word;
}
.toast-message{flex:1;min-width:0;word-break:break-word;}
.toast.toast-success{background:var(--primary-dark);border-color:var(--green);}
.toast.toast-error{background:var(--coral);border-color:var(--coral);}
.toast.toast-warning{background:var(--gold);color:var(--ink);border-color:#9a7617;}
.toast.toast-info{background:var(--ink);color:#fff;border-color:var(--primary);}
.toast-close{flex:0 0 34px;width:34px;height:34px;min-width:34px;min-height:34px;border:0;border-radius:9px;background:rgba(255,255,255,.13);color:inherit;font-size:20px;line-height:1;display:flex;align-items:center;justify-content:center;cursor:pointer;touch-action:manipulation;}
.toast-close:hover{background:rgba(255,255,255,.22);}
.toast-close:focus-visible{outline:2px solid currentColor;outline-offset:2px;}
.toast-progress{position:absolute;right:0;bottom:0;width:100%;height:3px;background:rgba(255,255,255,.7);transform-origin:right center;animation:toastProgress var(--toast-duration,3200ms) linear forwards;pointer-events:none;}
.toast.toast-success .toast-progress{background:#75dda1;}
.toast.toast-error .toast-progress{background:#ffe4e4;}
.toast.toast-warning .toast-progress{background:#725b13;}
.toast.toast-info .toast-progress{background:#9ac8ff;}
@keyframes toastProgress{from{transform:scaleX(1)}to{transform:scaleX(0)}}
@keyframes toastIn{ from{opacity:0;transform:translateY(10px);} to{opacity:1;transform:translateY(0);} }
.toast.toast-out{animation:toastOut .2s ease forwards;}
@keyframes toastOut{ to{opacity:0;transform:translateY(10px);} }
@media(max-width:480px){#toast-host{padding-inline:10px;gap:7px}.toast{max-width:none;font-size:12.5px;padding:10px 10px 12px;border-radius:12px}}
@media(prefers-reduced-motion:reduce){.toast,.toast.toast-out{animation:none!important}.toast-progress{animation:none!important;opacity:.45}}
@media(prefers-contrast:more){.toast{border-width:2px;box-shadow:0 0 0 1px currentColor,0 8px 24px rgba(0,0,0,.2)}}

/* ---------------------- PHASE A1 — Status Badge / Toggle ---------------------- */
.status-badge{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:700;padding:4px 10px;border-radius:20px;}
.status-badge.active{background:var(--green-tint);color:var(--green);}
.status-badge.inactive{background:var(--coral-tint);color:var(--coral);}
.status-badge.refund{background:var(--primary-tint);color:var(--primary-dark);}
.status-badge.muted{background:#ECE7DC;color:var(--ink-faint);}
.card-actions{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px;}
.card-actions .btn-sm{flex:1;min-width:80px;}

/* ---------------------- PHASE A1 — Loading / Skeleton ---------------------- */
.skeleton{background:linear-gradient(90deg,var(--surface-alt) 25%,#e5ded0 37%,var(--surface-alt) 63%);background-size:400% 100%;animation:skeletonWave 1.4s ease infinite;border-radius:12px;}
@keyframes skeletonWave{ 0%{background-position:100% 50%;} 100%{background-position:0 50%;} }
.skeleton-card{height:70px;margin-bottom:12px;}

/* ==================== پل مشترک صندلی حمل‌ونقل ==================== */
.sf-admin-seat-legend{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:7px;margin:10px 0}
.sf-admin-seat-legend-item{display:flex;align-items:center;gap:7px;font-size:11px;color:var(--ink-soft)}
.sf-admin-seat-dot{width:18px;height:18px;border-radius:5px;border:1px solid #c9c9c9;display:inline-block;flex:0 0 auto}
.sf-admin-seat-dot.free{background:#fff}.sf-admin-seat-dot.female{background:#F28BC8;border-color:#F28BC8}.sf-admin-seat-dot.male{background:#2AAED5;border-color:#2AAED5}.sf-admin-seat-dot.blocked{background:#C7C7C7;border-color:#C7C7C7}
.sf-admin-seat-map{background:#fff;border:1px solid var(--border);border-radius:22px;padding:12px 8px;overflow:auto;max-height:58vh}
.sf-admin-seat-row{display:grid;grid-template-columns:minmax(50px,1fr) 18px minmax(50px,1fr);align-items:center;gap:7px;width:100%;max-width:520px;margin:0 auto 8px}
.sf-admin-seat-group{display:flex;gap:6px;justify-content:center;flex-wrap:wrap}
.sf-admin-seat{width:38px;height:38px;border-radius:10px 10px 8px 8px;border:1.5px solid #aaa;background:#fff;color:#333;font-size:11px;font-weight:800;cursor:pointer;box-shadow:0 3px 0 #d8d8d8}
.sf-admin-seat.blocked{background:#C7C7C7;border-color:#C7C7C7;color:#777;box-shadow:0 3px 0 #aaa}
.sf-admin-seat.female{background:#F28BC8;border-color:#F28BC8;color:#fff;box-shadow:0 3px 0 #d56daa;cursor:not-allowed}
.sf-admin-seat.male{background:#2AAED5;border-color:#2AAED5;color:#fff;box-shadow:0 3px 0 #218fb0;cursor:not-allowed}
.sf-admin-wagon{border:1px solid var(--border);border-radius:16px;padding:9px;background:#fafafa;margin-bottom:9px}
.sf-admin-wagon-title{font-size:11px;font-weight:800;color:var(--ink-soft);margin-bottom:7px}
@media (min-width:600px){.sf-admin-seat-legend{grid-template-columns:repeat(4,minmax(0,1fr))}.sf-admin-seat{width:42px;height:42px}}

/* ==================== PHASE 146 — Manager Requests + Dashboard Notification Dots ==================== */

<div id="app-shell">
  <div id="app"></div>
  <div id="modal-root"></div>
  <div id="toast-host" role="region" aria-label="پیام‌های سامانه" aria-live="polite" aria-atomic="false"></div>
</div>

<script>
/* ==================== safaryar-admin.html — منطق برنامه ==================== */

/* ---------------------- کلیدهای مشترک localStorage (پل با safaryar.html) ---------------------- */
const MAIN_STORAGE_KEY = 'sefaryar_demo_state_v1';       // Snapshot اصلی اپ کاربر/مدیر خدمت — فقط serviceManagers از اینجا خوانده/نوشته می‌شود
const ADMIN_CATALOG_KEY = 'sefaryar_admin_catalog_v1';   // کاتالوگ خدمات افزوده‌شده توسط مدیر اصلی
const ADMIN_AUTH_KEY = 'sefaryar_admin_auth_v1';
const ADMIN_AUDIT_LOG_KEY = 'sefaryar_admin_audit_log_v1';
const ADMIN_DISCREPANCY_REVIEW_KEY = 'sefaryar_admin_discrepancy_review_v1';
const TRANSPORT_SEAT_CONFIG_KEY = 'sefaryar_transport_seat_configs_v1'; // پل مشترک تنظیمات صندلی با سفریار اصلی
const MANAGER_PERMISSIONS_KEY = 'sefaryar_manager_permissions_v1';
const MANAGER_REQUESTS_KEY = 'sefaryar_manager_requests_v1';
const ADMIN_NAV_SEEN_KEY = 'sefaryar_admin_nav_seen_v2';

/* پاک‌سازی یک‌باره‌ی داده‌های باقی‌مانده از تست‌های قبلی.
   بعد از این اجرا، داده‌های جدید طبق روال عادی دوباره در localStorage ذخیره می‌شوند. */
const CLEAN_BOOT_MARKER_KEY = 'sefaryar_reset_marker_v117';
function clearAllSefaryarPersistedDataOnce(){
  /* PHASE 145 — Shared-data safety fix.
     The admin panel and the main Sefaryar app deliberately share MAIN_STORAGE_KEY.
     The previous one-time cleanup removed every key beginning with `sefaryar_`,
     which also deleted the main app snapshot and therefore erased serviceManagers
     created by the admin.  Never perform a global cleanup from this separate app.
     Only mark this migration as completed; admin-owned data is managed explicitly
     by its own Reset actions. */
  try{
    if(window.localStorage.getItem(CLEAN_BOOT_MARKER_KEY)!=='1'){
      window.localStorage.setItem(CLEAN_BOOT_MARKER_KEY,'1');
    }
  }catch(e){}
  return false;
}
function sfAdmJson(key,fallback){try{const raw=localStorage.getItem(key);if(!raw)return fallback;const v=JSON.parse(raw);return v==null?fallback:v;}catch(e){return fallback;}}
function sfAdmWriteJson(key,value){try{localStorage.setItem(key,JSON.stringify(value));return true;}catch(e){return false;}}
function sfAdmManagerRequests(){const v=sfAdmJson(MANAGER_REQUESTS_KEY,[]);return Array.isArray(v)?v:[];}
function sfAdmManagerPermissions(){const v=sfAdmJson(MANAGER_PERMISSIONS_KEY,{});return v&&typeof v==='object'?v:{};}
function sfAdmTypeLabel(t){return {hotel:'هتل',tour:'تور',restaurant:'رستوران',attraction:'جاذبه',transport:'حمل‌ونقل',car_rental:'اجاره خودرو'}[t]||'خدمت';}
function sfAdmTypeKind(t){return {hotel:'hotels',tour:'tours',restaurant:'restaurants',attraction:'attractions',transport:'transport',car_rental:'carRentals'}[t]||null;}
function sfAdmAppendManagerNotification(req,type,title,message){try{const snap=sfAdmJson(MAIN_STORAGE_KEY,{});if(!Array.isArray(snap.notifications))snap.notifications=[];snap.notifications.push({id:'manager_notice_'+Date.now().toString(36)+'_'+Math.random().toString(36).slice(2,7),userId:null,userPhone:String(req.managerPhone||''),type,title,message,date:new Date().toISOString().slice(0,10),read:false});localStorage.setItem(MAIN_STORAGE_KEY,JSON.stringify(snap));return true;}catch(e){return false;}}
function sfAdmServiceHasBookings(req){const snap=sfAdmJson(MAIN_STORAGE_KEY,{}),trips=Array.isArray(snap.trips)?snap.trips:[],kind=sfAdmTypeKind(req.serviceType),sid=String(req.serviceId||''),name=String(req.serviceName||''),dest=String((DESTINATIONS.find(d=>String(d.id)===String(req.destId))||{}).name||'');const arrKey=kind==='hotels'?'hotels':kind==='tours'?'tours':kind==='restaurants'?'food':kind==='attractions'?'attractions':kind==='transport'?'tickets':'carRentals';for(const t of trips){for(const b of (t?.[arrKey]||[])){if(kind==='hotels'&&String(b.hotelId||'')===sid)return true;if(kind==='tours'&&String(b.tourId||'')===sid)return true;if(kind==='attractions'&&String(b.attractionId||'')===sid)return true;if(kind==='restaurants'&&String(t.destinationName||'')===dest&&String(b.restaurantName||'')===name)return true;if((kind==='transport'||kind==='carRentals')&&String(t.destinationName||'')===dest&&(String(b.serviceId||'')===sid||String(b.company||'')===name))return true;}}return false;}
function sfAdmNavSeen(){const v=sfAdmJson(ADMIN_NAV_SEEN_KEY,null);return v&&typeof v==='object'?v:null;}
function sfAdmTime(v){if(typeof v==='number')return v;const n=Date.parse(String(v||''));return Number.isFinite(n)?n:0;}
/* PHASE 145B — Persistent unread navigation dots.
   Read state is stored as seen IDs, not timestamps, so a section is marked
   unread only when a genuinely new record appears. Opening the section marks
   every currently-visible record as read; the state survives route changes and refreshes. */
function sfAdmItemIds(key){
  const snap=sfAdmJson(MAIN_STORAGE_KEY,{}), trips=Array.isArray(snap.trips)?snap.trips:[];
  const ids=[];
  const push=(v, fallback)=>{const s=String(v==null?'':v);if(s) ids.push(s); else if(fallback) ids.push(fallback);};
  if(key==='bookings'){
    trips.forEach((t,ti)=>['tickets','hotels','tours','food','attractions','carRentals'].forEach(k=>{
      (t?.[k]||[]).forEach((b,bi)=>push(b?.id, `booking:${t?.id||ti}:${k}:${bi}`));
    }));
  }else if(key==='payments'){
    (Array.isArray(snap.payments)?snap.payments:[]).forEach((p,i)=>push(p?.id,`payment:${i}`));
  }else if(key==='refunds'){
    (Array.isArray(snap.payments)?snap.payments:[]).filter(p=>p?.status==='refunded').forEach((p,i)=>push(p?.id,`refund:${i}`));
  }else if(key==='wallet'){
    (Array.isArray(snap.payments)?snap.payments:[]).forEach((p,i)=>push(p?.id,`wallet:${i}`));
  }else if(key==='feedback'){
    (Array.isArray(snap.feedbacks)?snap.feedbacks:[]).forEach((f,i)=>push(f?.id,`feedback:${i}:${f?.createdAt||''}`));
  }else if(key==='support'){
    (typeof loadSupportInbox==='function'?loadSupportInbox():[]).forEach((x,i)=>push(x?.id,`support:${i}:${x?.createdAt||x?.updatedAt||''}`));
  }else if(key==='alerts'){
    loadAdminAlerts().forEach((a,i)=>push(a?.id,a?.eventId?`alert:${a.eventId}`:`alert:${i}:${a?.createdAt||''}`));
  }
  return Array.from(new Set(ids));
}
function sfAdmManagerRequestIds(){
  return sfAdmManagerRequests().filter(r=>r&&r.status==='pending').map((r,i)=>String(r.id||`manager-request:${i}:${r.managerPhone||''}:${r.createdAt||''}`));
}
function sfAdmSeenIds(key){
  const d=sfAdmNavSeen()||{};
  const v=d[key];
  return Array.isArray(v)?v:[];
}
function sfAdmEnsureNavSeen(){
  let d=sfAdmNavSeen();
  if(!d || typeof d!=='object' || Array.isArray(d)) d={};
  const keys=['bookings','payments','refunds','wallet','feedback','support','alerts'];
  /* نخستین اجرای این نسخه عمداً همه رکوردهای موجود را ناخوانده در نظر می‌گیرد؛
     بعد از ورود به همان بخش، sfAdmMarkSeen آن‌ها را خوانده می‌کند. */
  keys.forEach(k=>{ if(!Array.isArray(d[k])) d[k]=[]; });
  if(!Array.isArray(d.managerRequests)) d.managerRequests=[];
  sfAdmWriteJson(ADMIN_NAV_SEEN_KEY,d);
  return d;
}
function sfAdmHasUnread(k){
  const current=k==='managerRequests'?sfAdmManagerRequestIds():sfAdmItemIds(k);
  const seen=new Set(sfAdmSeenIds(k));
  return current.some(id=>!seen.has(id));
}
function sfAdmDot(k){return sfAdmHasUnread(k)?'<span class="admin-notify-dot" title="مورد جدید"></span>':'';}
function sfAdmMarkSeen(k){
  const d=sfAdmEnsureNavSeen();
  const current=k==='managerRequests'?sfAdmManagerRequestIds():sfAdmItemIds(k);
  d[k]=current.slice(-500);
  sfAdmWriteJson(ADMIN_NAV_SEEN_KEY,d);
}
function sfAdmReqDot(){return sfAdmHasUnread('managerRequests')?'<span class="admin-notify-dot" title="درخواست جدید"></span>':'';}

         // Session مستقل خودِ پنل مدیر اصلی

/* شماره‌ی تنها مجاز برای ورود به این پنل. طبق درخواست، این عدد ثابت و
   قطعی است — هیچ شماره‌ی دیگری اجازه‌ی حتی شروع فرآیند ورود را ندارد. */

/* ==================== PHASE A1 — Toast System (مرکزی) ====================
   Toast.show(message, type) — type: success|error|warning|info. خودکار بعد
   از چند ثانیه محو می‌شود. RTL و Mobile Friendly، بدون نیاز به هیچ کتابخانه. */
const Toast = {
  _seq:0,
  _items:new Map(),
  show(message,type,durationOrOptions){
    const host=document.getElementById('toast-host');if(!host)return null;
    let text='',kind=type,extra=durationOrOptions;
    if(message&&typeof message==='object'&&!Array.isArray(message)){
      text=String(message.message??message.description??message.title??'').trim();kind=message.type??kind;extra=message.duration??extra;
    }else text=String(message??'').trim();
    if(kind&&typeof kind==='object'){extra=kind.duration??extra;kind=kind.type;}
    if(!text)return null;
    kind=['success','error','warning','info'].includes(kind)?kind:'info';
    let ms=Number(typeof extra==='object'&&extra?extra.duration:extra);
    if(!Number.isFinite(ms)||ms<=0)ms=kind==='error'?4600:kind==='warning'?4200:3200;
    ms=Math.max(1800,Math.min(10000,ms));
    while(host.querySelectorAll('.toast').length>=4){const first=host.querySelector('.toast');if(!first)break;Toast.dismiss(first.id,true);}
    const id='admin-toast-'+(++this._seq);
    const iconMap={success:'checkCircle',error:'warning',warning:'warning',info:'bell'};
    const el=document.createElement('div');el.id=id;el.className='toast toast-'+kind;el.dir='rtl';
    el.setAttribute('role',kind==='error'?'alert':'status');el.setAttribute('aria-live',kind==='error'?'assertive':'polite');el.setAttribute('aria-atomic','true');
    el.style.setProperty('--toast-duration',ms+'ms');
    el.innerHTML=ico(iconMap[kind])+'<span class="toast-message"></span><button type="button" class="toast-close" aria-label="بستن پیام" title="بستن پیام">×</button><span class="toast-progress" aria-hidden="true"></span>';
    el.querySelector('.toast-message').textContent=text;
    const rec={el,timer:null,remaining:ms,startedAt:Date.now(),paused:false};
    const schedule=()=>{if(!rec.paused&&el.isConnected){rec.startedAt=Date.now();rec.timer=window.setTimeout(()=>Toast.dismiss(id,false),Math.max(0,rec.remaining));}};
    const pause=()=>{if(rec.paused||!Toast._items.has(id))return;rec.paused=true;if(rec.timer){clearTimeout(rec.timer);rec.timer=null;}rec.remaining=Math.max(0,rec.remaining-(Date.now()-rec.startedAt));const bar=el.querySelector('.toast-progress');if(bar)bar.style.animationPlayState='paused';};
    const resume=()=>{if(!rec.paused||!Toast._items.has(id))return;rec.paused=false;const bar=el.querySelector('.toast-progress');if(bar)bar.style.animationPlayState='running';if(rec.remaining<=0){Toast.dismiss(id,false);return;}schedule();};
    el.addEventListener('mouseenter',pause);el.addEventListener('mouseleave',resume);el.addEventListener('focusin',pause);el.addEventListener('focusout',ev=>{if(!el.contains(ev.relatedTarget))resume();});
    el.querySelector('.toast-close').addEventListener('click',()=>Toast.dismiss(id,false));
    host.appendChild(el);this._items.set(id,rec);
    schedule();return id;
  },
  success(message,duration){return this.show(message,'success',duration);},
  error(message,duration){return this.show(message,'error',duration);},
  warning(message,duration){return this.show(message,'warning',duration);},
  info(message,duration){return this.show(message,'info',duration);},
  dismissAll(){return this.clear();},
  dismiss(id,immediate){
    const key=String(id||'');const rec=this._items.get(key);const el=rec?rec.el:document.getElementById(key);
    if(rec){if(rec.timer)clearTimeout(rec.timer);rec.timer=null;this._items.delete(key);}if(!el)return false;
    if(immediate){el.remove();return true;}
    el.classList.add('toast-out');window.setTimeout(()=>{if(el.isConnected)el.remove();},220);return true;
  },
  clear(){Array.from(this._items.keys()).forEach(id=>this.dismiss(id,true));const host=document.getElementById('toast-host');if(host)host.querySelectorAll('.toast').forEach(el=>el.remove());return true;}
};
window.Toast=Toast;
window.sfToastSystem={show:(message,type,duration)=>Toast.show(message,type,duration),dismiss:(id)=>Toast.dismiss(id,false),clear:()=>Toast.clear(),version:154};

/* ==================== PHASE A1 — Confirmation Dialog (عمومی) ====================
   Confirm.open({title, message, confirmLabel, danger, onConfirm}) — برای
   هر عملیات مخرب (حذف/غیرفعال‌سازی) استفاده می‌شود؛ طبق قانون Master Prompt
   هیچ عملیات مخربی بدون این Dialog اجرا نمی‌شود. */
const Confirm = {
  _cb: null, _keyHandler: null, _previousFocus: null, _previousOverflow: '',
  open({title, message, confirmLabel, cancelLabel, danger, onConfirm}={}){
    if(this._cb || this._keyHandler) this.close();
    let root = document.getElementById('modal-root');
    if(!root){ root=document.createElement('div'); root.id='modal-root'; document.body.appendChild(root); }
    this._previousFocus = document.activeElement;
    this._previousOverflow = document.body.style.overflow;
    this._cb = typeof onConfirm==='function' ? onConfirm : null;
    root.innerHTML = `<div class="modal-overlay" role="presentation" tabindex="-1" onclick="Confirm.close(event)">
      <div class="modal-sheet" role="alertdialog" aria-modal="true" aria-labelledby="sfAdminConfirmTitle" aria-describedby="sfAdminConfirmMessage" tabindex="-1" onclick="event.stopPropagation()">
        <div class="modal-handle" aria-hidden="true"></div>
        <h3 id="sfAdminConfirmTitle">${esc(title||'تأیید عملیات')}</h3>
        <p id="sfAdminConfirmMessage" style="white-space:pre-line;overflow-wrap:anywhere;">${esc(message||'آیا برای ادامه مطمئن هستید؟')}</p>
        <div class="modal-actions">
          <button type="button" class="btn btn-ghost sf-admin-confirm-cancel" onclick="Confirm.close()">${esc(cancelLabel||'انصراف')}</button>
          <button type="button" class="btn ${danger?'btn-danger-solid':'btn-primary'} sf-admin-confirm-accept" onclick="Confirm.confirm()">${esc(confirmLabel||'تأیید')}</button>
        </div>
      </div>
    </div>`;
    document.body.style.overflow='hidden';
    this._keyHandler=(ev)=>{
      if(ev.key==='Escape'){ev.preventDefault();this.close();return;}
      if(ev.key==='Tab'){
        const box=root.querySelector('.modal-sheet');
        const list=box ? Array.from(box.querySelectorAll('button:not([disabled]),[href],input:not([disabled]),select:not([disabled]),textarea:not([disabled]),[tabindex]:not([tabindex="-1"])')) : [];
        if(!list.length){ev.preventDefault();if(box)box.focus();return;}
        const first=list[0],last=list[list.length-1];
        if(ev.shiftKey&&document.activeElement===first){ev.preventDefault();last.focus();}
        else if(!ev.shiftKey&&document.activeElement===last){ev.preventDefault();first.focus();}
      }
    };
    document.addEventListener('keydown',this._keyHandler,true);
    const cancel=root.querySelector('.sf-admin-confirm-cancel');
    if(cancel){try{cancel.focus({preventScroll:true});}catch(_){cancel.focus();}}
  },
  close(ev){
    if(ev && ev.target !== ev.currentTarget) return;
    const root=document.getElementById('modal-root');
    if(root) root.innerHTML='';
    if(this._keyHandler) document.removeEventListener('keydown',this._keyHandler,true);
    this._keyHandler=null;this._cb=null;
    if(document.body) document.body.style.overflow=this._previousOverflow||'';
    const previous=this._previousFocus;this._previousFocus=null;
    if(previous&&previous.isConnected&&typeof previous.focus==='function'){try{previous.focus({preventScroll:true});}catch(_){try{previous.focus();}catch(__){}}}
  },
  confirm(){
    const cb=this._cb;
    this.close();
    if(cb){
      try{const result=cb();if(result&&typeof result.then==='function')result.catch(()=>Toast.show('عملیات انجام نشد. لطفاً دوباره تلاش کنید.','error'));}
      catch(err){try{Toast.show('عملیات انجام نشد. لطفاً دوباره تلاش کنید.','error');}catch(_){}}
    }
  },
};

/* ==================== PHASE A1 — Modal عمومی برای فرم (ویرایش) ====================
   Modal.open(htmlContent) — یک Bottom Sheet ساده برای میزبانی فرم‌ها (مثل
   ویرایش مدیر خدمت)؛ از همان ساختار بصری Confirm استفاده می‌کند اما محتوای
   دلخواه می‌پذیرد. */
const Modal = {
  open(html){
    const root = document.getElementById('modal-root');
    root.innerHTML = `<div class="modal-overlay" onclick="Modal.close(event)">
      <div class="modal-sheet" onclick="event.stopPropagation()">
        <div class="modal-handle"></div>
        ${html}
      </div>
    </div>`;
  },
  close(ev){
    if(ev && ev.target !== ev.currentTarget) return;
    document.getElementById('modal-root').innerHTML = '';
  },
};

/* ---------------------- خواندن/نوشتن Snapshot اصلی (فقط serviceManagers) ---------------------- */
function readMainSnapshot(){
  try{
    const raw = window.localStorage.getItem(MAIN_STORAGE_KEY);
    return raw ? JSON.parse(raw) : {};
  }catch(e){ return {}; }
}
function writeMainSnapshotField(field, value){
  try{
    /* Admin writes only its shared field, starting from the freshest Main
       snapshot so unrelated Main data is never replaced by a stale copy. */
    const snap = readMainSnapshot();
    snap[field] = value;
    window.localStorage.setItem(MAIN_STORAGE_KEY, JSON.stringify(snap));
  }catch(e){ /* بی‌صدا نادیده گرفته می‌شود؛ مثل رفتار persistState در اپ اصلی */ }
}
function loadServiceManagers(){
  const snap = readMainSnapshot();
  STATE.serviceManagers = Array.isArray(snap.serviceManagers) ? snap.serviceManagers : [];
}
function saveServiceManagers(){
  writeMainSnapshotField('serviceManagers', STATE.serviceManagers);
}

   (hotels/tours/food/attractions/tickets/carRentals) داخل هر trip مشتق
   می‌شود (toBookingEntity در main.html). چون ADMIN اینجا یک اپ کاملاً جدا
   است، نمی‌تواند تابع main.html را صدا بزند — پس همان منطق (فقط برای نمایش،
   بدون نوشتن) اینجا هم بازسازی می‌شود. Source of Truth همیشه trips داخل
   MAIN_STORAGE_KEY است؛ این پنل فقط می‌خواند. */
const ADMIN_BOOKING_SERVICE_META = {
  tickets:      {serviceType:'transportation', dateField:'date',        titleFn:b=>(b.company||'')+' ('+(b.type||'')+')'},
  hotels:       {serviceType:'hotel',           dateField:'checkIn',    titleFn:b=>b.hotelName},
  tours:        {serviceType:'tour',            dateField:'date',       titleFn:b=>b.tourName},
  food:         {serviceType:'restaurant',      dateField:'deliveryDate', titleFn:b=>b.restaurantName},
  attractions:  {serviceType:'attraction',      dateField:'visitDate',  titleFn:b=>b.attractionName},
  carRentals:   {serviceType:'car_rental',      dateField:'date',       titleFn:b=>(b.company||'')+' — '+(b.carModel||'')},
};
const ADMIN_BOOKING_STATUS_META = {
  draft:                   {label:'پیش‌نویس', badge:'warn'},
  pending:                 {label:'در انتظار تأیید', badge:'warn'},
  confirmed:               {label:'تایید شده', badge:'ok'},
  cancellation_requested:  {label:'درخواست لغو ثبت شد', badge:'warn'},
  cancelled:               {label:'لغو شده', badge:'bad'},
  refund_pending:          {label:'در انتظار استرداد وجه', badge:'warn'},
  refunded:                {label:'وجه مسترد شد', badge:'ok'},
  failed:                  {label:'ناموفق', badge:'bad'},
};
function adminBookingStatusMeta(status){
  return ADMIN_BOOKING_STATUS_META[status] || ADMIN_BOOKING_STATUS_META.confirmed;
}
function adminToBookingEntity(trip, arrayName, raw){
  const meta = ADMIN_BOOKING_SERVICE_META[arrayName];
  let title = 'رزرو';
  try{ title = meta.titleFn(raw) || 'رزرو'; }catch(e){}
  return {
    id: raw.id,
    tripId: trip.id,
    tripTitle: trip.destinationName || trip.title || trip.origin || '—',
    serviceType: meta.serviceType,
    serviceId: raw.hotelId || raw.tourId || raw.attractionId || raw.id,
    title,
    date: raw[meta.dateField] || null,
    total: raw.total != null ? raw.total : (raw.price || 0),
    status: raw.status || 'confirmed',
    // Audit Trail (additive)
    userId: trip.userId || null,
    origin: trip.origin || null,
    routeText: adminRouteText(trip),
    createdTs: raw.createdTs || null,
    trackingCode: adminBookingTracking(raw),
    restaurantName: raw.restaurantName || null,
  };
}
/* تمام Bookingهای همه‌ی Tripهای موجود در Snapshot — Global Scope، همان‌طور
   که Master Prompt برای SUPER_ADMIN می‌خواهد (Phase 131). */
function loadAllBookingsGlobal(){
  const snap = readMainSnapshot();
  const trips = Array.isArray(snap.trips) ? snap.trips : [];
  const ctx = adminAuditContext();
  const out = [];
  trips.forEach(trip=>{
    Object.keys(ADMIN_BOOKING_SERVICE_META).forEach(arrayName=>{
      (trip[arrayName]||[]).forEach(raw=>{
        const b = adminToBookingEntity(trip, arrayName, raw);
        const u = adminUserLabel(ctx.users, b.userId);
        b.userName = u.name; b.userPhone = u.phone;
        b.managerText = adminManagerText(adminManagersFor(ctx.managers, b.serviceType, b.serviceId, b.restaurantName), b.serviceType);
        const pl = ctx.payIndex[b.id] || [];
        b.payAttempts = pl;
        b.searchBlob = [b.title, b.tripTitle, b.userName, b.userPhone, b.trackingCode, b.id].concat(pl.map(p=>adminPaymentTracking(p))).filter(Boolean).join(' ').toLowerCase();
        out.push(b);
      });
    });
  });
  // جدیدترین رزروها اول
  return out.sort((a,b)=> String(b.date||'').localeCompare(String(a.date||'')));
}

/* ==================== Audit Trail — جزئیات Bookings / Payments / Wallet (فقط‌خواندنی) ====================
   هدف: وقتی کاربری می‌گوید «من این رزرو را نکردم»، یا کسی می‌گوید «پرداخت کردم» در حالی‌که ناموفق بوده،
   ادمین از روی «کاربر واقعی + زمان دقیق + روش + مدیر خدمت + کد رهگیری» حقیقت را پیدا کند.
   - هویت همیشه از userIdِ خودِ رکورد می‌آید (نه «کاربر جاری» — نسخه‌ی قبلی کیف پول این را فرض می‌کرد که
     با چند کاربر روی یک دستگاه، همه‌ی تراکنش‌ها را به نام کاربر لاگین‌شده نشان می‌داد).
   - رکوردهای قدیمی بدون کد/ساعت «جعل» نمی‌شوند: کدشان از id مشتق می‌شود (پیشوند L = Legacy؛ همان الگوریتم
     main.html) و ساعتشان «ثبت نشده» نمایش داده می‌شود.
   - هیچ ظاهر/تب/ساختار کارتی عوض نمی‌شود؛ فقط خطوط جزئیات (کلاس opt-meta موجود) اضافه می‌شود. */
function adminLegacyTrackingCode(prefix, id){
  let h = 2166136261;
  const s = String(id==null?'':id);
  for(let i=0;i<s.length;i++){ h ^= s.charCodeAt(i); h = Math.imul(h, 16777619) >>> 0; }
  return prefix + '-L' + String(h % 1000000000).padStart(9,'0');
}
function adminPaymentTracking(p){ return (p && p.trackingCode) ? p.trackingCode : adminLegacyTrackingCode('PY', p && p.id); }
function adminBookingTracking(raw){ return (raw && raw.trackingCode) ? raw.trackingCode : adminLegacyTrackingCode('BK', raw && raw.id); }
function adminLocalISO(ts){
  const d = new Date(ts);
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
}
function adminFmtDateTime(ts, isoDate){
  if(ts){
    let t = '';
    try{ t = new Date(ts).toLocaleTimeString('fa-IR',{hour:'2-digit',minute:'2-digit'}); }catch(e){}
    return adminFmtJalali(adminLocalISO(ts)) + ' · ' + t;
  }
  if(isoDate) return adminFmtJalali(String(isoDate).slice(0,10)) + ' · ساعت ثبت نشده';
  return '—';
}
function adminPayCmpDesc(a, b){
  const d = String(b.createdAt||'').localeCompare(String(a.createdAt||'')); if(d) return d;
  const t = (b.createdTs||0) - (a.createdTs||0); if(t) return t;
  return (b._i||0) - (a._i||0);
}
const ADMIN_PAY_STATE_LABEL = { success:'موفق', failed:'ناموفق', pending:'در انتظار', refunded:'استرداد شد', topup:'شارژ کیف پول' };
function adminUserIndex(){
  const snap = readMainSnapshot();
  const idx = {};
  const known = (snap.knownUsers && typeof snap.knownUsers==='object') ? snap.knownUsers : {};
  Object.keys(known).forEach(ph=>{
    const u = known[ph];
    if(u && u.id){ idx[u.id] = { name: ((u.firstName||'')+' '+(u.lastName||'')).trim(), phone: ph }; }
  });
  const cu = snap.user;
  if(cu && cu.id && !idx[cu.id]){
    idx[cu.id] = { name: (((cu.firstName||'')+' '+(cu.lastName||'')).trim() || cu.name || ''), phone: cu.phone || '' };
  }
  return idx;
}
function adminUserLabel(idx, userId){
  const u = userId ? idx[userId] : null;
  if(!u) return { name:'کاربر نامشخص', phone:'' };
  return { name: u.name || 'بدون نام', phone: u.phone || '' };
}
/* مدیر خدمتِ یک رزرو: هتل/تور/جاذبه با id (در کل کاتالوگ یکتاست — تست شد)، رستوران با نام (یکتا). سایر انواع مدیر ندارند. */
function adminManagersFor(managers, serviceType, serviceId, restaurantName){
  const list = (managers||[]).filter(m=>m && m.serviceId);
  if(serviceType==='hotel' || serviceType==='tour' || serviceType==='attraction') return list.filter(m=>m.serviceId===serviceId);
  if(serviceType==='restaurant') return list.filter(m=>restaurantName && m.serviceName===restaurantName);
  return [];
}
function adminManagerText(hit, serviceType){
  if(hit.length) return hit.map(m=>(m.name||'—')+(m.phone?' ('+m.phone+')':'')+(m.active===false?' — غیرفعال':'')).join('، ');
  if(!serviceType) return '—';
  return ['hotel','tour','attraction','restaurant'].includes(serviceType) ? 'مدیری تعیین نشده' : 'ندارد (این نوع خدمت مدیر ندارد)';
}
function adminAuditContext(){
  const snap = readMainSnapshot();
  const payments = Array.isArray(snap.payments) ? snap.payments : [];
  const trips = Array.isArray(snap.trips) ? snap.trips : [];
  const tripsById = {}; trips.forEach(t=>{ if(t && t.id) tripsById[t.id] = t; });
  const payIndex = {};
  payments.forEach((p,i)=>{ if(!p) return; const k = p.bookingId || '__none__'; (payIndex[k] = payIndex[k] || []).push(Object.assign({_i:i}, p)); });
  Object.keys(payIndex).forEach(k=>payIndex[k].sort(adminPayCmpDesc));
  return { users: adminUserIndex(), managers: Array.isArray(snap.serviceManagers) ? snap.serviceManagers : [], tripsById, payIndex };
}
function adminRouteText(trip){
  if(!trip) return '—';
  return (trip.origin||'—') + ' ← ' + (trip.destinationName || trip.title || '—');
}
/* خطوط جزئیات؛ هر خط با همان کلاس opt-meta که کارت‌های موجود دارند. */
function adminAuditLinesHTML(lines){
  return lines.filter(Boolean).map(x=>`<div class="opt-meta" style="margin-top:2px;">${x}</div>`).join('');
}
function adminCodeSpan(code){ return `<span dir="ltr" style="font-weight:700;">${esc(code)}</span>`; }

/* ==================== PHASE 132 — Payment Management (Global, Read-Only) ====================
   SUPER_ADMIN تمام پرداخت‌ها را می‌بیند. Source of Truth همیشه STATE.payments
   در main.html است که همین الان هم در MAIN_STORAGE_KEY نوشته می‌شود (بدون
   نیاز به هیچ Export جدید). برای هر Payment، عنوان Booking مرتبط هم برای
   خوانایی بهتر نمایش داده می‌شود (با اتصال از طریق bookingId/tripId، بدون
   ایجاد هیچ Data جدید — فقط Join برای نمایش). */
const ADMIN_PAYMENT_STATUS_META = {
  pending: {label:'در انتظار پرداخت', badge:'warn'},
  success: {label:'پرداخت موفق',      badge:'ok'},
  failed:  {label:'پرداخت ناموفق',    badge:'bad'},
  // استرداد یک «پرداخت موفق» نیست: قبلاً به‌خاطر نبودن این ورودی، نشان سبز «پرداخت موفق» می‌گرفت.
  // نشانِ کنارش (icon) آیکون استرداد است. این ورودی خودکار به فیلتر «وضعیت» هم اضافه می‌شود.
  refunded:{label:'استرداد وجه',       badge:'refund', icon:'refund'},
};
function adminPaymentStatusMeta(status){
  return ADMIN_PAYMENT_STATUS_META[status] || ADMIN_PAYMENT_STATUS_META.success;
}
function loadAllPaymentsGlobal(){
  const ctx = adminAuditContext();
  const snap = readMainSnapshot();
  const payments = Array.isArray(snap.payments) ? snap.payments : [];
  const trips = Array.isArray(snap.trips) ? snap.trips : [];
  // Index رزروها برای Join (bookingId → رزرو)
  const bookingIndex = {};
  trips.forEach(trip=>{
    Object.keys(ADMIN_BOOKING_SERVICE_META).forEach(arrayName=>{
      (trip[arrayName]||[]).forEach(raw=>{
        const b = adminToBookingEntity(trip, arrayName, raw);
        bookingIndex[b.id] = b;
      });
    });
  });
  const out = payments.filter(Boolean).map((p,i)=>{
    const b = bookingIndex[p.bookingId];
    const trip = ctx.tripsById[p.tripId] || null;
    const u = adminUserLabel(ctx.users, p.userId || (b && b.userId));
    const svcType = b ? b.serviceType : null;
    const mgr = adminManagersFor(ctx.managers, svcType, b && b.serviceId, b && b.restaurantName);
    const rec = {
      id: p.id,
      bookingId: p.bookingId,
      tripId: p.tripId,
      amount: p.amount,
      method: p.method,
      status: p.status,
      createdAt: p.createdAt,
      bookingTitle: b ? b.title : null,
      tripTitle: b ? b.tripTitle : null,
      serviceType: svcType,
      // Audit Trail (additive)
      userName: u.name, userPhone: u.phone,
      routeText: b ? b.routeText : adminRouteText(trip),
      createdTs: p.createdTs || null,
      trackingCode: adminPaymentTracking(p),
      bookingTrackingCode: b ? b.trackingCode : null,
      managerText: adminManagerText(mgr, svcType),
      note: p.note || null,
      _i: i,
    };
    rec.purpose = p.status==='topup' ? 'شارژ کیف پول'
                : (p.status==='refunded' ? 'استرداد وجه' + (rec.bookingTitle ? ' — ' + rec.bookingTitle : '')
                : (rec.bookingTitle ? (svcType ? bookingServiceTypeLabel(svcType) + ' — ' : '') + rec.bookingTitle : 'رزرو نامشخص'));
    rec.searchBlob = [rec.bookingTitle, rec.tripTitle, rec.userName, rec.userPhone, rec.trackingCode, rec.bookingTrackingCode, rec.bookingId, rec.purpose].filter(Boolean).join(' ').toLowerCase();
    return rec;
  });
  // جدیدترین پرداخت‌ها اول (تاریخ، سپس زمان دقیق، سپس ترتیب ثبت)
  return out.sort(adminPayCmpDesc);
}

/* ==================== PHASE 133 — Refund Management (Global, Read-Only) ====================
   Audit: در main.html، Refund یک Entity مستقل نیست — یک گذار وضعیت روی
   خودِ Booking است (REFUND_PENDING → REFUNDED، در initiateRefund) که در
   لحظه‌ی تکمیل، یک رکورد Payment با status='refunded' هم برایش ثبت می‌شود
   (createPayment(...,'refunded')). پس Refund Management اینجا یعنی Join
   این دو منبع موجود: بوکینگ‌هایی که الان در وضعیت استرداد هستند (در جریان
   یا کامل‌شده) به‌همراه رکورد Payment مرتبط (در صورت وجود). هیچ Entity/
   Persistence جدیدی ساخته نمی‌شود — طبق قانون «حداقل تغییر لازم». */
function loadAllRefundsGlobal(){
  const bookings = loadAllBookingsGlobal(); // شامل status هر رزرو
  const refundStatuses = new Set(['refund_pending','cancellation_requested','refunded']);
  const relevant = bookings.filter(b=>refundStatuses.has(b.status));
  const payments = loadAllPaymentsGlobal();
  const refundPaymentByBooking = {};
  payments.filter(p=>p.status==='refunded').forEach(p=>{ refundPaymentByBooking[p.bookingId] = p; });
  const out = relevant.map(b=>{
    const pay = refundPaymentByBooking[b.id] || null;
    return {
      bookingId: b.id,
      tripId: b.tripId,
      tripTitle: b.tripTitle,
      title: b.title,
      serviceType: b.serviceType,
      total: b.total,
      bookingStatus: b.status, // cancellation_requested | refund_pending | refunded
      refundedAt: pay ? pay.createdAt : null,
      refundMethod: pay ? pay.method : null,
    };
  });
  return out.sort((a,b)=> String(b.refundedAt||'').localeCompare(String(a.refundedAt||'')));
}
const ADMIN_REFUND_STATUS_META = {
  cancellation_requested: {label:'درخواست لغو ثبت شد',      badge:'warn'},
  refund_pending:         {label:'در انتظار استرداد وجه',   badge:'warn'},
  refunded:               {label:'وجه مسترد شد',            badge:'ok'},
};
function adminRefundStatusMeta(status){
  return ADMIN_REFUND_STATUS_META[status] || ADMIN_REFUND_STATUS_META.refund_pending;
}

/* ==================== Refund Policy Management (قابل‌تنظیم توسط SUPER_ADMIN) ====================
   طبق درخواست کاربر، استرداد دیگر همیشه ۱۰۰٪ نیست — SUPER_ADMIN می‌تواند
   برای هر نوع خدمت (هتل/تور/رستوران/جاذبه/حمل‌ونقل/اجاره‌خودرو) جداگانه
   پله‌های جریمه تعریف کند: «اگر بیش از X ساعت تا زمان حرکت/سرویس مانده،
   Y٪ جریمه». main.html دقیقاً همین کلید مشترک (REFUND_POLICY_KEY) را
   می‌خواند و در initiateRefund اعمال می‌کند — این پنل فقط می‌نویسد.
   پیش‌فرض (اگر ادمین هنوز چیزی تنظیم نکرده) دقیقاً طبق قانونی‌ست که کاربر
   داد: «بیش از ۱ ساعت مانده → ۱۰٪ جریمه»، «کمتر از ۱ ساعت مانده → ۵۰٪
   جریمه» — این پیش‌فرض هم اینجا و هم در main.html یکسان تعریف شده. */
const REFUND_POLICY_KEY = 'sefaryar_refund_policy_v1';
const DEFAULT_REFUND_POLICY_TIERS = [
  { minHoursLeft: 1, penaltyPercent: 10 },
  { minHoursLeft: 0, penaltyPercent: 50 },
];
const REFUND_POLICY_SERVICE_TYPES = [
  {key:'hotel', label:'هتل'},
  {key:'tour', label:'تور'},
  {key:'restaurant', label:'رستوران'},
  {key:'attraction', label:'جاذبه'},
  {key:'transportation', label:'حمل‌ونقل (بلیت)'},
  {key:'car_rental', label:'اجاره خودرو'},
];
function loadRefundPolicy(){
  try{
    const raw = window.localStorage.getItem(REFUND_POLICY_KEY);
    const parsed = raw ? JSON.parse(raw) : null;
    return (parsed && typeof parsed==='object') ? parsed : {};
  }catch(e){ return {}; }
}
function saveRefundPolicy(policy){
  try{ window.localStorage.setItem(REFUND_POLICY_KEY, JSON.stringify(policy)); }catch(e){}
}
function refundPolicyTiersForAdmin(serviceType){
  const policy = loadRefundPolicy();
  const tiers = policy[serviceType];
  return (Array.isArray(tiers) && tiers.length) ? tiers : DEFAULT_REFUND_POLICY_TIERS;
}

/* ==================== PHASE 134 — Wallet Management (Global, Read-Only) ====================
   Audit: در main.html، Wallet یک Entity مستقل نیست — طبق کامنت خودِ آن
   فایل (بالای createWalletCredit)، یک لایه‌ی مشتق‌شده روی همان
   STATE.payments است (تراکنش‌هایی با method='کیف پول دمو'). این پنل دقیقاً
   همان منطق getWalletTransactions/getWalletBalance را با همان مقادیر
   (WALLET_INITIAL_BALANCE=3,000,000) روی Snapshot خوانده‌شده بازتولید
   می‌کند — چون admin.html نمی‌تواند مستقیماً تابع main.html را صدا بزند.
   هیچ Persistence یا Entity جدیدی ساخته نمی‌شود. */
const ADMIN_WALLET_INITIAL_BALANCE = 3000000;
function loadWalletTransactionsGlobal(){
  const ctx = adminAuditContext();
  const snap = readMainSnapshot();
  const payments = Array.isArray(snap.payments) ? snap.payments : [];
  const trips = Array.isArray(snap.trips) ? snap.trips : [];
  const bookingIndex = {};
  trips.forEach(trip=>{
    Object.keys(ADMIN_BOOKING_SERVICE_META).forEach(arrayName=>{
      (trip[arrayName]||[]).forEach(raw=>{
        const b = adminToBookingEntity(trip, arrayName, raw);
        bookingIndex[b.id] = b;
      });
    });
  });
  return payments
    .map((p,i)=>Object.assign({_i:i}, p))
    .filter(p=>p && p.method==='کیف پول دمو')
    .map(p=>{
      const b = bookingIndex[p.bookingId];
      const trip = ctx.tripsById[p.tripId] || null;
      // خریدار = صاحب واقعیِ همین تراکنش (userId)، نه «کاربر جاری». (نسخه‌ی قبل: buyer = snap.user)
      const u = adminUserLabel(ctx.users, p.userId || (b && b.userId));
      const svcType = b ? b.serviceType : null;
      return {
        id:p.id, bookingId:p.bookingId, tripId:p.tripId, amount:p.amount, createdAt:p.createdAt, note:p.note||null,
        type: (p.status==='refunded' || p.status==='topup') ? 'credit' : 'debit',
        kind: p.status==='refunded' ? 'refund' : (p.status==='topup' ? 'topup' : 'payment'),
        status: p.status,
        serviceType: svcType,
        bookingTitle: b ? b.title : null,
        tripTitle: b ? b.tripTitle : null,
        userId: p.userId || (b && b.userId) || null,
        buyerName: u.name,
        buyerPhone: u.phone || null,
        // Audit Trail (additive)
        routeText: b ? b.routeText : adminRouteText(trip),
        createdTs: p.createdTs || null,
        trackingCode: adminPaymentTracking(p),
        bookingTrackingCode: b ? b.trackingCode : null,
        managerText: adminManagerText(adminManagersFor(ctx.managers, svcType, b && b.serviceId, b && b.restaurantName), svcType),
        method: p.method,
        _i: p._i,
      };
    })
    // Failed هم می‌آید (برای پیگیری ادعای «پرداخت کردم»)، اما پولی جابه‌جا نکرده و در موجودی حساب نمی‌شود.
    .filter(tx=>tx.status==='success' || tx.status==='refunded' || tx.status==='topup' || tx.status==='failed')
    .sort(adminPayCmpDesc);
}
/* موجودی هر کاربر مستقل است: در main هر کاربر با ۳٬۰۰۰٬۰۰۰ شروع می‌کند و فقط تراکنش‌های خودش روی آن اثر دارد
   (getWalletBalance(userId)). نسخه‌ی قبلی ادمین «یک» عدد داشت: ۳٬۰۰۰٬۰۰۰ منهای/به‌علاوه‌ی تراکنش‌های «همه‌ی
   کاربران» با هم؛ با بیش از یک کاربر عددی بی‌معنا (حتی منفی) می‌شد. حالا: موجودی هر کاربر جدا محاسبه و
   جمع کل = مجموع کیف پول‌ها. پرداخت ناموفق پولی جابه‌جا نکرده و حساب نمی‌شود. */
function computeWalletBalancesByUser(){
  const idx = adminUserIndex();
  const txs = loadWalletTransactionsGlobal().filter(tx=>tx.status!=='failed');
  const rows = {};
  Object.keys(idx).forEach(id=>{ rows[id] = {userId:id, name: idx[id].name || 'بدون نام', phone: idx[id].phone || '', balance: ADMIN_WALLET_INITIAL_BALANCE, txCount:0}; });
  txs.forEach(tx=>{
    const id = tx.userId || '__unknown__';
    if(!rows[id]){
      rows[id] = id==='__unknown__'
        ? {userId:id, name:'کاربر نامشخص', phone:'', balance:0, txCount:0, unknown:true}   // تراکنش بدون صاحب: کیف پولی ندارد؛ فقط خالص تراکنش‌ها
        : {userId:id, name: tx.buyerName || 'کاربر نامشخص', phone: tx.buyerPhone || '', balance: ADMIN_WALLET_INITIAL_BALANCE, txCount:0};
    }
    rows[id].balance += tx.type==='credit' ? tx.amount : -tx.amount;
    rows[id].txCount++;
  });
  return Object.values(rows);
}
function computeWalletBalanceGlobal(){
  return computeWalletBalancesByUser().reduce((s,r)=>s+r.balance, 0);
}

function adminVerifyTarget(query){
  const q=adminNormalizeText(query);
  if(!q) return {status:'missing',label:'اطلاعات ناقص',tone:'info',reasons:['یک شناسه، کد رهگیری یا کاربر وارد کنید.']};
  const {rows,by}=adminAllBookingsIndex();
  const payments=adminAllPaymentsWithLinks();
  let booking=null,payment=null;
  booking=rows.find(b=>[b.id,b.trackingCode,b.title].some(x=>adminNormalizeText(x)===q));
  if(!booking){
    payment=payments.find(p=>[p.id,p.trackingCode,p.bookingTrackingCode].some(x=>adminNormalizeText(x)===q));
    if(payment) booking=by[payment.bookingId]||null;
  }
  if(!booking){
    const userMatches=rows.filter(b=>adminNormalizeText(b.userId)===q || adminNormalizeText(b.userPhone)===q);
    if(userMatches.length===1) booking=userMatches[0];
    else if(userMatches.length>1) return {status:'ambiguous',label:'نیاز به بررسی',tone:'warn',reasons:['این کاربر چند رزرو دارد؛ برای راستی‌آزمایی دقیق‌تر شناسه یا کد رهگیری رزرو/پرداخت را وارد کنید.'],matches:userMatches};
  }
  if(!booking){ return {status:'not_found',label:'رکورد پیدا نشد',tone:'info',reasons:['هیچ رزرو یا پرداختی با این مشخصات پیدا نشد.']}; }
  const attempts=adminBookingPaymentAttempts(booking); const success=attempts.find(p=>p.status==='success');
  const refund=adminFindRefundForBooking(booking.id)[0]||null;
  const checks=[];
  if(!booking.userId) checks.push({code:'USER_MISSING',label:'کاربر رزرو مشخص نیست',tone:'bad'});
  if(booking.userId && !booking.userName) checks.push({code:'USER_UNKNOWN',label:'کاربر رزرو در Snapshot شناخته نشد',tone:'warn'});
  if(booking.status==='confirmed' && !success) checks.push({code:'BOOKING_WITHOUT_SUCCESS',label:'رزرو تأیید شده اما پرداخت موفق پیدا نشد',tone:'bad'});
  if(success && adminAmount(success.amount)!==adminAmount(booking.total)) checks.push({code:'AMOUNT_MISMATCH',label:'مبلغ رزرو و پرداخت موفق برابر نیست',tone:'bad'});
  if(success && success.userId && booking.userId && success.userId!==booking.userId) checks.push({code:'USER_MISMATCH',label:'کاربر پرداخت با کاربر رزرو متفاوت است',tone:'bad'});
  if(success && success.tripId && booking.tripId && success.tripId!==booking.tripId) checks.push({code:'TRIP_MISMATCH',label:'سفر پرداخت با سفر رزرو متفاوت است',tone:'bad'});
  if(attempts.some(p=>p.status==='failed') && booking.status==='confirmed') checks.push({code:'FAILED_PLUS_CONFIRMED',label:'تلاش ناموفق در کنار رزرو تأیید شده وجود دارد',tone:'warn'});
  if(refund && refund.bookingStatus==='refunded' && !success) checks.push({code:'REFUND_WITHOUT_SUCCESS',label:'استرداد بدون پرداخت موفق',tone:'bad'});
  if(refund && success && adminAmount(refund.total)!==adminAmount(success.amount)) checks.push({code:'REFUND_AMOUNT_MISMATCH',label:'مبلغ استرداد با پرداخت موفق برابر نیست',tone:'bad'});
  let status='verified',label='تأیید شد',tone='ok';
  if(checks.some(x=>x.tone==='bad')){status='discrepancy';label='مغایرت دارد';tone='bad';}
  else if(checks.length){status='review';label='نیاز به بررسی';tone='warn';}
  return {status,label,tone,booking,payment:payment||success,attempts,refund,checks,reasons:checks.map(x=>x.label)};
}
function adminDetectDiscrepancies(){
  const {rows,by}=adminAllBookingsIndex(); const payments=adminAllPaymentsWithLinks(); const out=[]; const push=(code,severity,title,detail,entityType,entityId,meta)=>out.push({id:code+'|'+entityType+'|'+String(entityId||''),code,severity,title,detail,entityType,entityId,meta:meta||{}});
  const successByBooking={};
  payments.forEach(p=>{if(p.status==='success' && p.bookingId) successByBooking[p.bookingId]=successByBooking[p.bookingId]||[]; if(p.status==='success'&&p.bookingId) successByBooking[p.bookingId].push(p);});
  rows.forEach(b=>{
    const attempts=adminBookingPaymentAttempts(b); const successes=successByBooking[b.id]||[];
    if(b.status==='confirmed' && !successes.length) push('D001','critical','رزرو بدون پرداخت موفق','رزرو تأیید شده است اما هیچ پرداخت موفقی برای آن پیدا نشد.','booking',b.id,{bookingId:b.id});
    successes.forEach(p=>{
      if(adminAmount(p.amount)!==adminAmount(b.total)) push('D005','critical','مغایرت مبلغ','مبلغ پرداخت موفق با مبلغ رزرو برابر نیست.','booking',b.id,{paymentId:p.id,bookingAmount:b.total,paymentAmount:p.amount});
      if(p.userId && b.userId && p.userId!==b.userId) push('D003','critical','مغایرت کاربر','کاربر پرداخت و کاربر رزرو متفاوت هستند.','booking',b.id,{paymentId:p.id});
      if(p.tripId && b.tripId && p.tripId!==b.tripId) push('D004','critical','مغایرت سفر','پرداخت به سفر دیگری متصل است.','booking',b.id,{paymentId:p.id});
    });
    if(attempts.some(p=>p.status==='failed') && b.status==='confirmed') push('D006','warning','پرداخت ناموفق + رزرو تأیید شده','حداقل یک تلاش پرداخت ناموفق در کنار رزرو تأیید شده وجود دارد.','booking',b.id);
    const refs=adminFindRefundForBooking(b.id);

    if(b.userId && !b.userName) push('D009','warning','کاربر ناشناخته','شناسه کاربر رزرو در Snapshot قابل تطبیق نیست.','booking',b.id,{userId:b.userId});
  });
  payments.forEach(p=>{
    if(!p.bookingId && p.status!=='topup') push('D002','critical','پرداخت بدون رزرو','تراکنش پرداختی فاقد bookingId است.','payment',p.id);
    else if(p.bookingId && !by[p.bookingId] && p.status!=='topup') push('D010','critical','تراکنش یتیم','پرداخت به رزروی اشاره می‌کند که وجود ندارد.','payment',p.id,{bookingId:p.bookingId});
  });
  return out;
}

   نگاشت استفاده می‌کنند؛ قبل از Load داده، Permission بررسی می‌شود. */
const ROUTE_PERMISSIONS = Object.freeze({
  'services-global': PERMISSIONS.SERVICES_READ,
  'bookings-global': PERMISSIONS.BOOKINGS_READ,
  'payments-global': PERMISSIONS.PAYMENTS_READ,
  'refunds-global': PERMISSIONS.PAYMENTS_MANAGE,
  'refund-policy': PERMISSIONS.PAYMENTS_MANAGE,
  'wallet-global': PERMISSIONS.PAYMENTS_READ,
  'alerts-global': PERMISSIONS.ALERTS_READ,
  'feedback-global': PERMISSIONS.FEEDBACK_READ,
  'faq-global': PERMISSIONS.SUPPORT_READ,
  'support-inbox': PERMISSIONS.SUPPORT_MANAGE,
  'bug-reports': PERMISSIONS.SUPPORT_MANAGE,
  'security-verification': PERMISSIONS.AUDIT_READ,
  'security-discrepancies': PERMISSIONS.AUDIT_READ,
  'admin-audit-log': PERMISSIONS.AUDIT_READ,
  'manager-requests': PERMISSIONS.USERS_MANAGE,
});
function routePermission(route){
  if(String(route||'').startsWith('service:')) return PERMISSIONS.SERVICES_READ;
  return ROUTE_PERMISSIONS[route] || null;
}
function canOpenRoute(route){
  const required=routePermission(route);
  return !required || hasPermission(required);
}

function otpAutoAdvanceScript(){
  // فوکوس خودکار بین خانه‌های کد تایید — فقط تجربه کاربری، بدون تاثیر در منطق
  return `<scr`+`ipt>
    (function(){
      const boxes = document.querySelectorAll('.pin-boxes input');
      boxes.forEach((b,i)=>{
        b.addEventListener('input', ()=>{ if(b.value && boxes[i+1]) boxes[i+1].focus(); });
        b.addEventListener('keydown', (e)=>{ if(e.key==='Backspace' && !b.value && boxes[i-1]) boxes[i-1].focus(); });
      });
      if(boxes[0]) boxes[0].focus();
    })();
  <\/scr`+`ipt>`;
}

const Auth = {
  submitPhone(ev){
    ev.preventDefault();
    const phone = ev.target.phone.value.trim();
    if(phone !== ADMIN_PHONE){
      adminAudit('ACCESS_DENIED','AUTH',phone,null,{allowed:false},'شماره مجاز نیست');
      STATE._err.login = 'دسترسی به این پنل فقط با شماره مدیر اصلی سیستم مجاز است.';
      render();
      return false;
    }
    STATE._err.login = null;
    STATE.auth = { step: AUTH.password ? 'password' : 'otp' };
    render();
    return false;
  },
  submitOtp(ev){
    ev.preventDefault();
    const boxes = ev.target.querySelectorAll('input');
    const code = Array.from(boxes).map(b=>b.value).join('');
    if(code !== OTP_CODE){
      STATE._err.login = 'کد وارد شده صحیح نیست.';
      render();
      return false;
    }
    STATE._err.login = null;
    STATE.auth = { step: 'setPassword' };
    render();
    return false;
  },
  setPassword(ev){
    ev.preventDefault();
    const f = ev.target;
    const p1 = f.p1.value, p2 = f.p2.value;
    if(p1 !== p2){
      STATE._err.login = 'رمز عبور و تکرار آن یکسان نیستند.';
      render();
      return false;
    }
    AUTH = { password: p1, loggedIn: true };
    adminAudit('LOGIN_SUCCESS','AUTH',ADMIN_PHONE,null,{method:'OTP+PASSWORD'},'ورود موفق مدیر');
    saveAuth(AUTH);
    STATE._err.login = null;
    STATE.auth = null;
    STATE.route = 'dashboard';
    render();
    return false;
  },
  submitPassword(ev){
    ev.preventDefault();
    const pw = ev.target.pw.value;
    if(pw !== AUTH.password){
      adminAudit('LOGIN_FAILED','AUTH',ADMIN_PHONE,null,{method:'PASSWORD',failed:true},'رمز عبور نادرست');
      STATE._err.login = 'رمز عبور نادرست است.';
      render();
      return false;
    }
    AUTH.loggedIn = true;
    adminAudit('LOGIN_SUCCESS','AUTH',ADMIN_PHONE,null,{method:'PASSWORD'},'ورود موفق مدیر');
    saveAuth(AUTH);
    STATE._err.login = null;
    STATE.auth = null;
    STATE.route = 'dashboard';
    render();
    return false;
  },
  backToPhone(){
    STATE._err.login = null;
    STATE.auth = { step:'phone' };
    render();
  },
  logout(){
    adminAudit('LOGOUT','AUTH',ADMIN_PHONE,{loggedIn:true},{loggedIn:false},'خروج مدیر');
    AUTH.loggedIn = false;
    saveAuth(AUTH);
    STATE.auth = { step: AUTH.password ? 'password' : 'phone' };
    STATE.route = 'dashboard';
    render();
  },
};

/* ==================== PHASE A1 — Service Manager Management ====================
   کارت مشترک مدیر خدمت (هم در Dashboard هم در pageServiceType استفاده می‌شود).
   شامل: Status Badge (فعال/غیرفعال)، ویرایش نام/موبایل، فعال‌سازی/غیرفعال‌سازی،
   حذف — همه با Confirmation Dialog برای عملیات مخرب. */
function managerCardHTML(m){
  const isActive = m.active !== false; // پیش‌فرض فعال (سازگار با داده‌های قدیمی بدون فیلد active)
  const assignedLabel = m.serviceId ? (m.serviceName || 'خدمت نامشخص') : 'هنوز خدمتی Assign نشده';
  const assignBadge = m.serviceId
    ? `<span class="status-badge active">${ico('checkCircle')} Assign شده</span>`
    : `<span class="status-badge inactive">${ico('warning')} بدون Assignment</span>`;
  return `<div class="card">
    <div class="card-row">
      <div style="flex:1;min-width:0;">
        <div class="opt-title">${esc(m.name)} <span class="status-badge ${isActive?'active':'inactive'}">${isActive?ico('checkCircle'):ico('warning')} ${isActive?'فعال':'غیرفعال'}</span></div>
        <div class="opt-meta">${esc(serviceManagerLabel(m.serviceType))} · ${esc(cityById(m.destId)?cityById(m.destId).name:'')} · ${esc(m.phone)}</div>
        <div class="opt-meta" style="margin-top:2px;">${assignBadge} ${esc(assignedLabel)}</div>
      </div>
    </div>
    <div class="card-actions">
      <button class="btn btn-sm btn-outline" onclick="Actions.openEditManager('${m.id}')">${ico('users')} ویرایش</button>
      <button class="btn btn-sm ${isActive?'btn-ghost':'btn-primary'}" onclick="Actions.toggleManagerActive('${m.id}')">${isActive?'غیرفعال‌سازی':'فعال‌سازی'}</button>
      <button class="btn btn-sm btn-danger" onclick="Actions.confirmRemoveManager('${m.id}')">${ico('trash')} حذف</button>
    </div>
    <div class="card-actions">
      <button class="btn btn-sm btn-primary" style="flex:2;" onclick="Actions.openAssignService('${m.id}')">${ico('pin')} ${m.serviceId?'تغییر Assignment':'Assign به یک خدمت'}</button>
      ${m.serviceId ? `<button class="btn btn-sm btn-danger" onclick="Actions.confirmUnassignService('${m.id}')">لغو Assignment</button>` : ''}
    </div>
    ${m.serviceType===SERVICE_TYPES.TRANSPORT && m.serviceId ? `<div class="card-actions"><button class="btn btn-sm btn-outline" style="width:100%;" onclick="Actions.openSeatConfig('${m.id}')">${ico('bus')} تنظیمات صندلی حمل‌ونقل</button></div>` : ''}
  </div>`;
}

/* ==================== PHASE A2 — Service Assignment ====================
   Assignment واقعی: مدیر خدمت به یک آیتم مشخص از کاتالوگ واقعی main.html
   (یا کاتالوگ خودِ این پنل) وصل می‌شود — نه فقط به یک نوع خدمت + شهر.
   جریان دقیقاً طبق Master Prompt: SUPER_ADMIN ↓ SERVICE MANAGER ↓ SERVICE ↓
   ASSIGN. لیست آیتم‌های قابل‌انتخاب بر اساس destId و serviceType خودِ مدیر
   فیلتر می‌شود تا Assignment همیشه منطقی/معتبر بماند (بدون Orphan). */
function assignServiceModalHTML(mgrId){
  const m = STATE.serviceManagers.find(x=>x.id===mgrId);
  if(!m) return '';
  const items = assignableItemsFor(m.serviceType, m.destId);
  const cityName = cityById(m.destId) ? cityById(m.destId).name : '';
  return `
    <h3>Assign کردن «${esc(m.name)}»</h3>
    <p>یک ${esc(serviceManagerLabel(m.serviceType).replace('مدیر ',''))} موجود در ${esc(cityName)} را برای این مدیر انتخاب کنید. مدیر فقط به همین یک خدمت دسترسی خواهد داشت.</p>
    ${items.length ? `
    <form onsubmit="return Actions.submitAssignService(event,'${mgrId}')">
      <div class="field">
        <label>خدمت</label>
        <select name="serviceId" required>
          <option value="" disabled ${!m.serviceId?'selected':''}>— انتخاب کنید —</option>
          ${items.map(it=>`<option value="${esc(it.id)}" ${m.serviceId===it.id?'selected':''}>${esc(it.name)}</option>`).join('')}
        </select>
      </div>
      <div class="modal-actions">
        <button type="button" class="btn btn-ghost" onclick="Modal.close()">انصراف</button>
        <button type="submit" class="btn btn-primary">ثبت Assignment</button>
      </div>
    </form>
    ` : `
    <div class="alert info">${ico('checkCircle')} هیچ ${esc(serviceManagerLabel(m.serviceType).replace('مدیر ',''))} ثبت‌شده‌ای در ${esc(cityName)} پیدا نشد. یا مقصد مدیر را تغییر دهید یا صبر کنید تا در سفریار اصلی خدمتی برای این شهر ثبت شود.</div>
    <div class="modal-actions"><button type="button" class="btn btn-ghost" style="flex:1;" onclick="Modal.close()">بستن</button></div>
    `}
  `;
}

/* ==================== PHASE A3 — Global Services Management ====================
   نمایش سراسری همه‌ی خدمات واقعی موجود در سفریار اصلی (Phase 129) — فقط
   خواندنی از REAL_CATALOG_EXPORT_KEY. برای هر آیتم مشخص می‌شود که آیا یک
   مدیر خدمت به آن Assign شده یا نه. ادمین اینجا چیزی نمی‌سازد/ویرایش
   نمی‌کند (چون Source of Truth کاتالوگ واقعی، main.html است)؛ این صفحه
   Scope سراسری SUPER_ADMIN برای *دیدن* کل خدمات است. */
function pageServicesGlobal(){
  loadCatalog(); // realCatalog را تازه کن
  loadServiceManagers();
  const filter = STATE._svcFilter || {kind:'', destId:''};
  const rows = [];
  SERVICE_META.forEach(meta=>{
    const kind = catalogKindFor(meta.key);
    if(filter.kind && filter.kind !== meta.key) return;
    const byDest = STATE.realCatalog[kind] || {};
    Object.keys(byDest).forEach(destId=>{
      if(filter.destId && filter.destId !== destId) return;
      (byDest[destId]||[]).forEach(item=>{
        const assignedManagers = STATE.serviceManagers.filter(m=>m.serviceId===item.id);
        rows.push({ type: meta.key, label: meta.label, destId, item, assignedManagers });
      });
    });
  });

  return `<div class="topbar">
      <a class="back-btn" href="javascript:void(0)" onclick="Nav.backToDashboard()">${ico('arrowRight')}</a>
      <div><h1>خدمات موجود</h1><div class="top-sub">نمای سراسری کاتالوگ واقعی سفریار (فقط‌خواندنی)</div></div>
    </div>
    <div class="page">
      <div class="field"><label>نوع خدمت</label>
        <select onchange="Actions.setSvcFilter('kind', this.value)">
          <option value="">همه</option>
          ${SERVICE_META.map(m=>`<option value="${m.key}" ${filter.kind===m.key?'selected':''}>${m.label}</option>`).join('')}
        </select>
      </div>
      <div class="field"><label>مقصد</label>
        <select onchange="Actions.setSvcFilter('destId', this.value)">
          <option value="">همه</option>
          ${DESTINATIONS.map(d=>`<option value="${d.id}" ${filter.destId===d.id?'selected':''}>${esc(d.name)}</option>`).join('')}
        </select>
      </div>

      <div class="section-title">نتایج <span class="hint">${rows.length} خدمت</span></div>
      ${rows.length ? rows.map(r=>{
        const cityName = cityById(r.destId) ? cityById(r.destId).name : '';
        return `<div class="card">
          <div class="card-row">
            <div style="flex:1;min-width:0;">
              <div class="opt-title">${esc(r.item.name)}</div>
              <div class="opt-meta">${esc(r.label)} · ${esc(cityName)}</div>
              <div class="opt-meta" style="margin-top:2px;">
                ${r.assignedManagers.length
                  ? `<span class="status-badge active">${ico('checkCircle')} ${r.assignedManagers.length} مدیر Assign شده</span> ${esc(r.assignedManagers.map(m=>m.name).join('، '))}`
                  : `<span class="status-badge inactive">${ico('warning')} بدون مدیر Assign شده</span>`}
              </div>
            </div>
          </div>
        </div>`;
      }).join('') : sfAdminEmptyCompact('با این فیلتر خدمتی پیدا نشد. ممکن است هنوز سفریار اصلی در همین مرورگر باز نشده باشد؛ بدون آن، کاتالوگ واقعی صادر نمی‌شود.', {icon:'hotel',title:'خدمتی برای نمایش نیست'})}
    </div>`;
}

/* ==================== PHASE A3 — Booking Management (Global, Read-Only) ====================
   Phase 131: SUPER_ADMIN تمام Bookingها را می‌بیند (View/Search/Filter/
   Status). این پنل هیچ رزروی نمی‌سازد/تغییر نمی‌دهد — فقط از Snapshot
   main.html می‌خواند. Search بر اساس عنوان رزرو و مقصد سفر است. */
function pageBookingsGlobal(){
  const filter = STATE._bkFilter || {status:'', serviceType:'', q:''};
  const all = loadAllBookingsGlobal();
  const filtered = all.filter(b=>{
    if(filter.status && b.status !== filter.status) return false;
    if(filter.serviceType && b.serviceType !== filter.serviceType) return false;
    if(filter.q){
      const q = filter.q.trim();
      if(q && !((b.title||'').includes(q) || (b.tripTitle||'').includes(q) || String(b.searchBlob||'').includes(q.toLowerCase()))) return false;
    }
    return true;
  });

  return `<div class="topbar">
      <a class="back-btn" href="javascript:void(0)" onclick="Nav.backToDashboard()">${ico('arrowRight')}</a>
      <div><h1>رزروها</h1><div class="top-sub">نمای سراسری همه‌ی رزروهای سفریار (فقط‌خواندنی)</div></div>
    </div>
    <div class="page">
      <div class="field"><label>جستجو</label>
        <input type="text" placeholder="نام خدمت یا مقصد سفر..." value="${esc(filter.q||'')}" oninput="Actions.setBkFilter('q', this.value)">
      </div>
      <div class="field"><label>وضعیت</label>
        <select onchange="Actions.setBkFilter('status', this.value)">
          <option value="">همه</option>
          ${Object.keys(ADMIN_BOOKING_STATUS_META).map(s=>`<option value="${s}" ${filter.status===s?'selected':''}>${ADMIN_BOOKING_STATUS_META[s].label}</option>`).join('')}
        </select>
      </div>
      <div class="field"><label>نوع خدمت</label>
        <select onchange="Actions.setBkFilter('serviceType', this.value)">
          <option value="">همه</option>
          ${['hotel','tour','restaurant','attraction','transportation','car_rental'].map(t=>`<option value="${t}" ${filter.serviceType===t?'selected':''}>${bookingServiceTypeLabel(t)}</option>`).join('')}
        </select>
      </div>

      <div class="section-title">نتایج <span class="hint" id="bookingsResultCount">${filtered.length} رزرو از ${all.length}</span></div>
      ${bookingsResultListHTML()}
    </div>`;
}
/* لیست نتایج رزروها جدا شده تا setBkFilter('q',...) بتواند فقط همین بخش
   را جایگزین کند، بدون Re-render کل صفحه (حفظ Focus روی Input جستجو). */
function bookingsResultListHTML(){
  const filter = STATE._bkFilter || {status:'', serviceType:'', q:''};
  const all = loadAllBookingsGlobal();
  const filtered = all.filter(b=>{
    if(filter.status && b.status !== filter.status) return false;
    if(filter.serviceType && b.serviceType !== filter.serviceType) return false;
    if(filter.q){
      const q = filter.q.trim();
      if(q && !((b.title||'').includes(q) || (b.tripTitle||'').includes(q) || String(b.searchBlob||'').includes(q.toLowerCase()))) return false;
    }
    return true;
  });
  const countEl = document.getElementById('bookingsResultCount');
  if(countEl) countEl.textContent = `${filtered.length} رزرو از ${all.length}`;
  return `<div id="bookingsResultList">
      ${filtered.length ? filtered.map(b=>{
        const sm = adminBookingStatusMeta(b.status);
        const badgeClass = sm.badge==='ok' ? 'active' : (sm.badge==='bad' ? 'inactive' : 'inactive');
        return `<div class="card">
          <div class="card-row">
            <div style="flex:1;min-width:0;">

function paymentsFilteredCount(all, filter){
  return all.filter(p=>paymentMatchesFilter(p, filter)).length;
}
function paymentMatchesFilter(p, filter){
  if(filter.status && p.status !== filter.status) return false;
  if(filter.q){
    const q = filter.q.trim();
    if(q && !((p.bookingTitle||'').includes(q) || (p.tripTitle||'').includes(q) || String(p.searchBlob||'').includes(q.toLowerCase()))) return false;
  }
  return true;
}
